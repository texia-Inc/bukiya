name: GitHub Pages に公開

# docs/ のページ（トップ・キャノンボール）と、ビルドした天下一閃、群勢キャノン、
# ブキヤ・サバイバー（Flutter Web）を1つのサイトにまとめて公開する。Settings → Pages の Source は「GitHub Actions」にする。
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'tenka-issen/**'
      - 'crowd_cannon/**'
      - 'bukiya_game/lib/features/survivor/**'
      - 'bukiya_game/lib/survivor_main.dart'
      - 'bukiya_game/assets/audio/survivor/**'
      - 'bukiya_game/web/**'
      - 'bukiya_game/pubspec.yaml'
      - 'bukiya_game/pubspec.lock'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: pages
        uses: actions/configure-pages@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: ブキヤ・サバイバーを Web 向けにビルドする
        working-directory: bukiya_game
        run: |
          flutter pub get
          # サイトのサブパスで動くよう base href を合わせ、CanvasKit も同梱して外部 CDN に頼らない
          flutter build web -t lib/survivor_main.dart \
            --base-href "${{ steps.pages.outputs.base_path }}/survivor/" \
            --no-web-resources-cdn --no-wasm-dry-run
          sed -i 's#<title>bukiya_game</title>#<title>ブキヤ・サバイバー</title>#; s#content="bukiya_game"#content="ブキヤ・サバイバー"#' build/web/index.html
          # 描画解像度を2倍密度までに抑えるスクリプトを、Flutter の起動より前に読み込ませる
          sed -i 's#<script src="flutter_bootstrap.js"#<script src="dpr_cap.js"></script>\n  <script src="flutter_bootstrap.js"#' build/web/index.html
          grep -q 'dpr_cap.js' build/web/index.html
      - name: 天下一閃を1つの HTML にまとめる
        run: python3 tenka-issen/build.py
      - name: サイトを組み立てる
        run: |
          mkdir -p _site/tenka-issen
          cp -r docs/. _site/
          cp tenka-issen/dist/index.html _site/tenka-issen/index.html
          mkdir -p _site/crowd-cannon
          cp -r crowd_cannon/index.html crowd_cannon/style.css crowd_cannon/src _site/crowd-cannon/
          mkdir -p _site/survivor
          cp -r bukiya_game/build/web/. _site/survivor/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
