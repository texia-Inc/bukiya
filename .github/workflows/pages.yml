name: GitHub Pages に公開

# docs/ のページ（トップ・キャノンボール）と、ビルドした天下一閃、群勢キャノンを
# 1つのサイトにまとめて公開する。Settings → Pages の Source は「GitHub Actions」にする。
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'tenka-issen/**'
      - 'crowd_cannon/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 天下一閃を1つの HTML にまとめる
        run: python3 tenka-issen/build.py
      - name: サイトを組み立てる
        run: |
          mkdir -p _site/tenka-issen
          cp -r docs/. _site/
          cp tenka-issen/dist/index.html _site/tenka-issen/index.html
          mkdir -p _site/crowd-cannon
          cp -r crowd_cannon/index.html crowd_cannon/style.css crowd_cannon/src _site/crowd-cannon/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
