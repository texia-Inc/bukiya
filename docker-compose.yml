version: '3.8'

services:
  # PostgreSQL データベース
  postgres:
    image: postgres:15
    container_name: bukiya_postgres
    environment:
      POSTGRES_DB: bukiya_game
      POSTGRES_USER: bukiya_user
      POSTGRES_PASSWORD: bukiya_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./database/seed_data.sql:/docker-entrypoint-initdb.d/02-seed_data.sql
    networks:
      - bukiya_network
    restart: unless-stopped

  # Redis キャッシュ・セッション管理
  redis:
    image: redis:7-alpine
    container_name: bukiya_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - bukiya_network
    restart: unless-stopped
    command: redis-server --appendonly yes

  # FastAPI バックエンド
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bukiya_backend
    environment:
      DATABASE_URL: postgresql://bukiya_user:bukiya_password@postgres:5432/bukiya_game
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: bukiya_secret_key_change_in_production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      REFRESH_TOKEN_EXPIRE_DAYS: 365
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
      - redis
    networks:
      - bukiya_network
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # pgAdmin データベース管理ツール
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: bukiya_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin_password
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - bukiya_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:

networks:
  bukiya_network:
    driver: bridge
