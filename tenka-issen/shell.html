<title>天下一閃 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700;800&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
/* Layout: full-bleed 3D battlefield; HUD canvas above it; menus are lacquer panels that leave the 3D showcase visible. Single dark look by design. */
:root {
  --ink: #0f131b;
  --panel: rgba(18,23,33,.94);
  --paper: #ece4d2;
  --paper-dim: #a9a291;
  --gold: #d4ae55;
  --crimson: #b8392c;
  --indigo: #4a76c9;
  --line: rgba(212,174,85,.4);
  --display: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--ink); color: var(--paper); font-family: var(--body); overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; margin: 0; }
#game { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
#hud { position: fixed; inset: 0; display: block; z-index: 2; touch-action: none; }
.overlay { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; background: radial-gradient(ellipse at center, rgba(15,19,27,.35), rgba(15,19,27,.85)); z-index: 5; overflow-y: auto; }
.card { width: min(560px, 100%); padding: 26px 22px; background: linear-gradient(180deg, rgba(23,29,40,.94), rgba(15,19,27,.96)); border: 1px solid var(--line); box-shadow: 0 0 0 4px rgba(15,19,27,.8), 0 0 0 5px rgba(212,174,85,.22); display: grid; gap: 16px; }
.kicker { font-size: 12px; letter-spacing: .4em; color: var(--gold); }
h1 { margin: 0; font-family: var(--display); font-weight: 800; font-size: clamp(50px, 13vw, 86px); line-height: 1; letter-spacing: .08em; color: var(--paper); text-shadow: 0 2px 0 #000, 0 0 24px rgba(212,174,85,.25); text-wrap: balance; }
h1 .sub { display: block; font-size: 15px; letter-spacing: .3em; color: var(--paper-dim); margin-top: 10px; font-family: var(--body); font-weight: 500; text-shadow: none; }
h2 { margin: 0; font-family: var(--display); font-size: 28px; letter-spacing: .08em; text-wrap: balance; }
h3 { margin: 0; font-size: 12px; letter-spacing: .3em; color: var(--gold); font-weight: 700; }
.lead { margin: 0; line-height: 1.8; font-size: 14px; }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 13px; color: var(--paper-dim); margin: 0; }
.keys dt { color: var(--paper); }
.keys dd { margin: 0; }
kbd { display: inline-block; min-width: 1.6em; padding: 1px 6px; border: 1px solid rgba(236,228,210,.35); border-bottom-width: 2px; font-family: var(--body); font-size: 12px; text-align: center; color: var(--paper); }
.btn { appearance: none; border: 1px solid var(--gold); background: linear-gradient(180deg, #2a2416, #17140d); color: var(--gold); font-family: var(--display); font-size: 21px; letter-spacing: .4em; padding: 11px 0 11px .4em; cursor: pointer; width: 100%; }
.btn:hover { background: linear-gradient(180deg, #3a301a, #1f1a10); }
.btn.sub { border-color: rgba(236,228,210,.35); color: var(--paper); font-size: 15px; letter-spacing: .2em; padding: 9px 0 9px .2em; background: rgba(15,19,27,.6); }
.btn:focus-visible, .pick:focus-visible { outline: 2px solid var(--paper); outline-offset: 3px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > * { flex: 1 1 140px; }
/* 武将・合戦選択 */
#select { place-items: end stretch; background: linear-gradient(180deg, rgba(15,19,27,0) 30%, rgba(15,19,27,.75)); padding: 0; }
.selpanel { width: 100%; max-height: 62%; overflow-y: auto; background: var(--panel); border-top: 1px solid var(--line); padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; }
@media (min-width: 900px) {
  #select { place-items: stretch end; background: linear-gradient(90deg, rgba(15,19,27,0) 40%, rgba(15,19,27,.7)); }
  .selpanel { width: 470px; max-height: none; height: 100%; border-top: 0; border-left: 1px solid var(--line); padding: 24px; align-content: start; }
}
.picks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.pick { appearance: none; text-align: left; border: 1px solid rgba(236,228,210,.18); background: rgba(10,13,19,.6); color: var(--paper); padding: 10px; display: grid; grid-template-columns: 38px minmax(0, 1fr); gap: 2px 10px; cursor: pointer; font-family: var(--body); }
.pick[aria-pressed="true"] { border-color: var(--gold); background: rgba(212,174,85,.12); }
.pick .mon { grid-row: span 2; width: 38px; height: 38px; }
.pick b { font-family: var(--display); font-size: 16px; }
.pick small { color: var(--paper-dim); font-size: 11px; }
.pick:disabled { opacity: .4; cursor: not-allowed; }
.stages .pick { grid-template-columns: minmax(0, 1fr) auto; }
.stages { grid-template-columns: 1fr; }
.rank { font-family: var(--display); font-size: 20px; color: var(--gold); align-self: center; grid-row: span 2; }
.desc { font-size: 13px; line-height: 1.7; color: var(--paper); margin: 0; min-height: 3.4em; }
.lvline { font-size: 12px; color: var(--paper-dim); font-variant-numeric: tabular-nums; }
.brief { display: grid; gap: 10px; max-height: 40vh; overflow-y: auto; }
.say { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; align-items: start; font-size: 14px; line-height: 1.7; }
.say .face { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-size: 16px; color: #fff; border: 1px solid rgba(255,255,255,.3); }
.say b { display: block; font-size: 12px; color: var(--gold); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
.stats div { padding: 10px 4px; border-top: 1px solid var(--line); }
.stats b { display: block; font-family: var(--display); font-size: 28px; color: var(--paper); font-variant-numeric: tabular-nums; }
.stats span { font-size: 11px; letter-spacing: .2em; color: var(--paper-dim); }
#resTitle.win { color: var(--gold); }
#resTitle.lose { color: var(--crimson); }
#pad { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
#pad .bt { position: absolute; pointer-events: auto; border-radius: 50%; border: 2px solid rgba(236,228,210,.5); background: rgba(15,19,27,.45); color: var(--paper); font-family: var(--display); font-size: 20px; display: grid; place-items: center; touch-action: none; }
#pad .bt.on { background: rgba(212,174,85,.45); }
#bA { width: 76px; height: 76px; right: 22px; bottom: calc(36px + env(safe-area-inset-bottom, 0px)); }
#bC { width: 62px; height: 62px; right: 108px; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); }
#bJ { width: 58px; height: 58px; right: 28px; bottom: calc(126px + env(safe-area-inset-bottom, 0px)); }
#bD { width: 52px; height: 52px; right: 184px; bottom: calc(30px + env(safe-area-inset-bottom, 0px)); font-size: 14px; }
#bM { width: 62px; height: 62px; right: 102px; bottom: calc(104px + env(safe-area-inset-bottom, 0px)); font-size: 15px; border-color: var(--gold); color: var(--gold); }
#bP { width: 40px; height: 40px; left: 16px; top: calc(150px + env(safe-area-inset-top, 0px)); font-size: 13px; font-family: var(--body); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<canvas id="game" aria-label="戦場"></canvas>
<canvas id="hud"></canvas>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<div id="pad" hidden>
  <div class="bt" id="bA" data-act="attack">攻</div>
  <div class="bt" id="bC" data-act="charge">溜</div>
  <div class="bt" id="bJ" data-act="jump">跳</div>
  <div class="bt" id="bD" data-act="dodge">回避</div>
  <div class="bt" id="bM" data-act="musou">無双</div>
  <div class="bt" id="bP" data-act="pause">||</div>
</div>

<div class="overlay" id="title">
  <div class="card">
    <div class="kicker">一騎当千 ・ 戦国アクション</div>
    <h1>天下一閃<span class="sub">TENKA ISSEN</span></h1>
    <p class="lead">四人の武将から一人を選び、三つの合戦を戦い抜け。砦を落とし、味方を救い、敵の総大将を討ち取れ。</p>
    <dl class="keys">
      <dt><kbd>WASD</kbd> / <kbd>←↑↓→</kbd></dt><dd>移動</dd>
      <dt><kbd>J</kbd></dt><dd>通常攻撃</dd>
      <dt><kbd>K</kbd></dt><dd>チャージ攻撃（通常攻撃の何段目かで技が変化）</dd>
      <dt><kbd>Space</kbd></dt><dd>ジャンプ（空中で <kbd>J</kbd> / <kbd>K</kbd> でジャンプ攻撃）</dd>
      <dt><kbd>Shift</kbd></dt><dd>回避</dd>
      <dt><kbd>L</kbd></dt><dd>無双奥義（ゲージ満タン時）</dd>
      <dt><kbd>P</kbd></dt><dd>一時停止</dd>
    </dl>
    <div class="row">
      <button class="btn" id="toSelect">出陣</button>
    </div>
    <button class="btn sub" id="muteBtn1">音：オン</button>
  </div>
</div>

<div class="overlay" id="select" hidden>
  <div class="selpanel">
    <h3>武将を選ぶ</h3>
    <div class="picks" id="charPicks"></div>
    <div>
      <h2 id="selName">天城 迅</h2>
      <div class="lvline" id="selLv"></div>
    </div>
    <p class="desc" id="selDesc"></p>
    <h3>合戦を選ぶ</h3>
    <div class="picks stages" id="stagePicks"></div>
    <div class="row">
      <button class="btn sub" id="backTitle">戻る</button>
      <button class="btn" id="toBrief">次へ</button>
    </div>
  </div>
</div>

<div class="overlay" id="brief" hidden>
  <div class="card">
    <div class="kicker" id="briefKicker">第一戦</div>
    <h2 id="briefTitle"></h2>
    <p class="lead" id="briefDesc"></p>
    <div class="brief" id="briefTalk"></div>
    <div class="row">
      <button class="btn sub" id="briefBack">戻る</button>
      <button class="btn" id="startBtn">出陣</button>
    </div>
  </div>
</div>

<div class="overlay" id="result" hidden>
  <div class="card">
    <div class="kicker" id="resKicker">合戦結果</div>
    <h1 id="resTitle">勝利</h1>
    <p class="lead" id="resLead"></p>
    <div class="stats">
      <div><b id="sKo">0</b><span>撃破数</span></div>
      <div><b id="sTime">0:00</b><span>経過時間</span></div>
      <div><b id="sRank">-</b><span>評価</span></div>
    </div>
    <p class="lead" id="resExp"></p>
    <button class="btn" id="nextBtn">次の合戦へ</button>
    <div class="row">
      <button class="btn sub" id="againBtn">もう一度</button>
      <button class="btn sub" id="resSelect">武将・合戦選択</button>
    </div>
  </div>
</div>

<div class="overlay" id="pause" hidden>
  <div class="card">
    <h2>一時停止</h2>
    <button class="btn" id="resumeBtn">再開</button>
    <div class="row">
      <button class="btn sub" id="muteBtn2">音：オン</button>
      <button class="btn sub" id="retreatBtn">撤退する</button>
    </div>
  </div>
</div>

<script>
/*__GAME_JS__*/
</script>
