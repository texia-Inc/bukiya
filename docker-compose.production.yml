version: '3.8'

services:
  # バックエンドのみ（データベースは外部VPS）
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bukiya_backend
    environment:
      # VPSのデータベースに接続
      DATABASE_URL: postgresql://bukiya_user:bukiya_password@your-vps-db-host:5432/bukiya_game
      REDIS_URL: redis://your-vps-redis-host:6379/0
      SECRET_KEY: your_production_secret_key_here
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      REFRESH_TOKEN_EXPIRE_DAYS: 365
      ENVIRONMENT: production
    ports:
      - "8000:8000"
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  # 管理画面（React）
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: bukiya_admin
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://your-backend-url:8000
    restart: unless-stopped

networks:
  bukiya_network:
    driver: bridge