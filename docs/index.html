<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bukiya ゲーム置き場</title>
<style>
:root{--bg:#0c0f13;--ink:#ece7da;--muted:#9aa29c;--sign:#0f6b3f;--amber:#f2c230;--line:rgba(236,231,218,.18)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Hiragino Kaku Gothic ProN','Noto Sans JP',system-ui,sans-serif;padding:40px 16px}
main{max-width:640px;margin:0 auto;display:grid;gap:16px}
h1{font-size:24px;margin:0}
p{color:var(--muted);margin:0;line-height:1.6}
a.card{display:block;text-decoration:none;color:inherit;background:var(--sign);border:2px solid #e9eee6;border-radius:8px;box-shadow:0 0 0 2px var(--sign);padding:14px 16px}
a.card:hover,a.card:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
a.card b{display:block;font-size:20px}
a.card span{font-size:13px;opacity:.85}
</style>
</head>
<body>
<main>
  <h1>bukiya ゲーム置き場</h1>
  <p>ブラウザでそのまま遊べるプロトタイプ。</p>
  <a class="card" href="./cannonball/"><b>CANNONBALL キャノンボール</b><span>東海岸から西海岸まで、武器ありの大陸横断レース（3D）</span></a>
</main>
</body>
</html>
