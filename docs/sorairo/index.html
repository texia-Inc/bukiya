<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="空から集めた素材で武器を鍛えて売り、常連の冒険者をダンジョンへ送り出す放置型の武器屋ゲーム。">
<title>空色の武器屋</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: the shopfront scene fills the top of the screen; the shop ledger (purse, rank, tabs) sits in a dark-glass panel below */
:root{
  --night:#070a24;
  --panel:#0d1238;
  --panel-2:#151b4c;
  --ink:#f4f0e8;
  --ink-dim:rgba(244,240,232,.66);
  --line:rgba(160,200,255,.18);
  --sky:#8fd3ff;
  --gold:#ffc46b;
  --bad:#ff8f9e;
  --good:#9ff0c0;
  --display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--body);display:flex;flex-direction:column;overflow:hidden;-webkit-tap-highlight-color:transparent}
#stage{position:relative;height:40%;min-height:230px;flex:none}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:pointer;touch-action:manipulation}
.stage-top{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 0;pointer-events:none}
.shopname{font-family:var(--display);font-weight:700;font-size:1.3rem;letter-spacing:.2em;text-shadow:0 1px 10px rgba(0,0,30,.7)}
.shopname span{display:block;font-family:var(--body);font-weight:400;font-size:.68rem;letter-spacing:.25em;color:var(--ink-dim);margin-top:2px}
.phase{font-size:.72rem;letter-spacing:.15em;padding:5px 12px;border-radius:999px;background:rgba(8,10,40,.6);border:1px solid var(--line);text-align:right}
.tip{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);font-size:.7rem;letter-spacing:.08em;color:var(--ink-dim);
  background:rgba(8,10,40,.6);padding:4px 12px;border-radius:999px;pointer-events:none;white-space:nowrap}

.panel{flex:1;min-height:0;overflow-y:auto;background:linear-gradient(180deg,var(--panel),var(--night));border-top:1px solid var(--line);
  padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 18px)}
.wrap{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.gold{display:flex;align-items:baseline;gap:5px;font-weight:700;font-size:1.2rem;font-variant-numeric:tabular-nums}
.gold::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px 2px rgba(255,196,107,.6);align-self:center}
.gold small{font-weight:500;font-size:.7rem;color:var(--ink-dim)}
.rank{display:flex;align-items:center;gap:8px;font-size:.75rem;color:var(--ink-dim);flex:1;min-width:180px}
.rank b{font-family:var(--display);color:var(--ink);font-size:.95rem;letter-spacing:.08em;white-space:nowrap}
.bar{height:4px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden;flex:1;min-width:50px}
.bar i{display:block;height:100%;background:var(--sky);transition:width .3s}
.bar.gold-bar i{background:var(--gold)}
.mats{display:flex;flex-wrap:wrap;gap:5px}
.mat{display:flex;align-items:center;gap:5px;font-size:.72rem;padding:3px 9px;border-radius:999px;background:var(--panel-2);font-variant-numeric:tabular-nums}
.mat i,.need i{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 6px var(--c);flex:none}
.mat b{font-weight:700}
.mat.rare{box-shadow:inset 0 0 0 1px var(--gold);color:var(--gold)}
.boss{display:inline-block;color:var(--bad);font-size:.7rem;font-weight:700;margin-left:6px;padding:1px 7px;border:1px solid var(--bad);border-radius:999px}

button{font:inherit;color:inherit}
.btn{cursor:pointer;border:1px solid var(--line);background:rgba(143,211,255,.12);border-radius:9px;padding:6px 11px;font-weight:700;font-size:.78rem;
  letter-spacing:.04em;transition:background .15s,opacity .15s;white-space:nowrap}
.btn:hover:not(:disabled){background:rgba(143,211,255,.24)}
.btn:disabled{opacity:.36;cursor:default}
.btn:focus-visible,.tab:focus-visible,.seg button:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
.btn.g{background:var(--gold);color:#2a1a10;border-color:transparent}
.btn.g:hover:not(:disabled){background:#ffd58f}
.btn.sm{padding:4px 8px;font-size:.72rem}

.tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tab{cursor:pointer;background:none;border:0;padding:9px 13px;font-size:.84rem;letter-spacing:.12em;color:var(--ink-dim);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;position:relative}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--sky)}
.tab .dot{position:absolute;top:6px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--gold)}
.sec{font-size:.7rem;letter-spacing:.22em;color:var(--ink-dim);margin:6px 0 0;display:flex;justify-content:space-between;align-items:center;gap:8px}
.list{display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:var(--panel-2)}
.row.locked{opacity:.45}
.row .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.nm{font-weight:700;font-size:.88rem}
.nm em{font-style:normal;color:var(--sky);margin-left:4px}
.nm .st{color:var(--gold);font-size:.72rem;margin-left:4px;letter-spacing:.04em}
.sub{display:flex;flex-wrap:wrap;gap:3px 10px;font-size:.71rem;color:var(--ink-dim);font-variant-numeric:tabular-nums}
.need{display:inline-flex;align-items:center;gap:4px}
.need.short{color:var(--bad)}
.acts{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.ico{width:26px;height:26px;flex:none;color:var(--c);filter:drop-shadow(0 0 5px var(--c))}
.note{font-size:.78rem;color:var(--ink-dim);line-height:1.7;margin:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{cursor:pointer;background:none;border:0;padding:6px 12px;font-size:.78rem;color:var(--ink-dim)}
.seg button[aria-pressed="true"]{background:var(--sky);color:#0b1240;font-weight:700}
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.slot{min-width:0;border-radius:10px;background:var(--panel-2);padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;font-size:.7rem}
.slot.empty{background:transparent;border:1px dashed var(--line);color:var(--ink-dim);justify-content:center;min-height:78px}
.slot .nm{font-size:.74rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.slot .pr{color:var(--gold);font-variant-numeric:tabular-nums}
.req{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.card{min-width:0;padding:9px;border-radius:10px;background:var(--panel-2);display:flex;flex-direction:column;gap:5px;border:1px solid var(--line)}
.card .who{font-size:.68rem;color:var(--ink-dim)}
.card .say{font-family:var(--display);font-size:.84rem;line-height:1.45}
.card.empty{border-style:dashed;background:transparent;color:var(--ink-dim);font-size:.72rem;align-items:center;justify-content:center;min-height:90px}
.log{display:flex;flex-direction:column;gap:3px;font-size:.74rem;color:var(--ink-dim);font-variant-numeric:tabular-nums}
.log b{color:var(--gold);font-weight:500}
.forge{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;color:var(--ink-dim);cursor:pointer}
.toggle input{accent-color:var(--sky)}
select{font:inherit;font-size:.78rem;color:var(--ink);background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
.cnt{font-variant-numeric:tabular-nums;font-weight:700;min-width:1.6em;text-align:center}

#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 54px);transform:translate(-50%,-8px);opacity:0;z-index:9;
  background:rgba(10,14,50,.94);border:1px solid var(--line);padding:9px 16px;border-radius:999px;font-size:.84rem;letter-spacing:.04em;
  transition:opacity .25s,transform .25s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.good{color:var(--gold)}#toast.bad{color:var(--bad)}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:rgba(4,6,26,.62);z-index:10}
.wcard{max-width:23rem;width:100%;text-align:center;padding:22px 20px;border-radius:18px;background:var(--panel-2);border:1px solid var(--line);display:flex;flex-direction:column;gap:10px;align-items:center}
.wcard h2{font-family:var(--display);margin:0;font-size:1.35rem;letter-spacing:.15em}
.wcard .big{font-size:1.8rem;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
.wcard ul{list-style:none;margin:0;padding:0;font-size:.82rem;color:var(--ink-dim);line-height:1.9}
@media (max-width:460px){.slot{padding:7px 4px}.req,.forge{grid-template-columns:1fr}.card.empty{min-height:0;padding:12px}.tab{padding:9px 10px;letter-spacing:.06em}}
@media (min-width:900px){#stage{height:46%}}
</style>
</head>
<body>

<div id="stage">
  <canvas id="scene" aria-label="夕暮れの通りに建つ武器屋と、空から降る光"></canvas>
  <div class="stage-top">
    <div class="shopname">空色堂<span>空の素材で、旅の武器を</span></div>
    <div class="phase" id="phase">夕暮れ</div>
  </div>
  <div class="tip" id="tip">降ってくる光をタップすると素材が手に入る</div>
</div>

<div class="panel">
  <div class="wrap">
    <div class="head">
      <span class="gold" id="gold">0<small>G</small></span>
      <div class="rank"><b id="rankName">ランク1</b><div class="bar"><i id="repBar"></i></div><span id="repTxt"></span></div>
    </div>
    <div class="mats" id="mats"></div>
    <div class="tabs" role="tablist" id="tabs"></div>
    <div id="pane"></div>
  </div>
</div>

<div id="toast"></div>
<div id="welcome" class="overlay" hidden>
  <div class="wcard">
    <h2>おかえりなさい</h2>
    <p class="note" id="wTime"></p>
    <div class="big" id="wGold"></div>
    <ul id="wList"></ul>
    <button class="btn g" id="claim">店を開ける</button>
  </div>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const cv=$('scene'),ctx=cv.getContext('2d');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const mix=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t);
const rgb=(c,a=1)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const smooth=t=>t*t*(3-2*t);
const mod=(a,n)=>((a%n)+n)%n;
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[(Math.random()*a.length)|0];
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const fmt=n=>Math.floor(n).toLocaleString();
const mmss=s=>{s=Math.max(0,Math.ceil(s));const m=Math.floor(s/60);return m?`${m}分${String(s%60).padStart(2,'0')}秒`:`${s}秒`};

/* ================= data ================= */
const MATS={

  {id:'bow',name:'夕焼けの弓',type:'bow',need:{dusk:2,cloud:1},atk:18,price:42,rate:.9,rank:1,c:'#ffad66'},
  {id:'staff',name:'星読みの杖',type:'staff',need:{star:2,cloud:1,ore:1},atk:26,price:60,rate:.86,rank:2,c:'#c9b6ff'},
  {id:'spear',name:'蒼天の槍',type:'spear',need:{ore:3,sky:2},atk:30,price:75,rate:.85,rank:2,c:'#8fd3ff'},

  {id:'moonbow',name:'月影の弓',type:'bow',need:{star:3,dusk:2,ore:1},atk:50,price:150,rate:.72,rank:4,c:'#b5c6ff'},
  {id:'comet',name:'彗星の槍',type:'spear',need:{comet:1,star:2,ore:3},atk:70,price:260,rate:.65,rank:5,c:'#9ff3ff'},

const RID=Object.fromEntries(RECIPES.map(r=>[r.id,r]));
const CLASSES=[

  {who:'槍使いの傭兵',likes:['spear'],h:1.1,hat:1,cape:0},
  {who:'星を追う狩人',likes:['bow','dagger'],h:1,hat:1,cape:0},
  {who:'見習いの魔法使い',likes:['staff'],h:.9,hat:2,cape:1},

  {id:'tomb',name:'彗星の墓所',base:130,dur:1200,loot:{comet:[1,2],star:[3,5]},gold:[150,300],rank:4,rare:'heart',bosses:{5:'彗星の亡霊',10:'尾を引く者'}},

const MAXF=10;

const AID=Object.fromEntries(ADVS.map(a=>[a.id,a]));
const POLICY={cheap:{name:'安め',m:.85,p:.95},fair:{name:'適正',m:1,p:.8},bold:{name:'強気',m:1.3,p:.5}};
const ENCH=[.9,.75,.6,.45,.3];
const UPS=[
  {id:'forge',name:'炉を増やす',max:3,ef:l=>`炉 ${l}基`,base:120,k:3},
  {id:'smith',name:'見習い鍛冶師',max:6,ef:l=>l?`自動で鍛える ・ 鍛冶速度 ×${(1+.2*(l-1)).toFixed(1)}`:'雇うと選んだ武器を自動で鍛える',base:150,k:1.9},

const UID=Object.fromEntries(UPS.map(u=>[u.id,u]));

/* ================= state ================= */
const KEY='sorairo-bukiya-v2';
const fresh=()=>({gold:80,rep:0,clock:0,p:.3,last:Date.now(),
  mats:{ore:6,sky:4,cloud:5,dusk:3,star:2,comet:0,scale:0,orb:0,core:0,heart:0},kills:{},
  items:[{id:1,r:'dagger',st:1,atk:12,plus:0,shown:true},{id:2,r:'ironsword',st:2,atk:22,plus:0,shown:true},{id:3,r:'bow',st:1,atk:17,plus:0,shown:false}],
  uid:4,policy:'fair',autoShow:true,
  forge:[],smithRecipe:'dagger',smithOn:true,
  workers:{ore:1,sky:1,cloud:1,dusk:0,star:0,comet:0},idle:0,hires:0,
  up:{forge:1,smith:0,sign:0,net:0,lamp:0,store:0},
  advs:[{id:'alto',lv:1,xp:0,w:null,rest:0},{id:'mina',lv:1,xp:0,w:null,rest:0}],runs:[],floors:{},dlog:[],requests:[],reqT:20,guestT:3,acc:{},sold:0,crafted:0});
let S=fresh();
try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(d&&d.mats){S={...fresh(),...d,mats:{...fresh().mats,...d.mats},workers:{...fresh().workers,...d.workers},up:{...fresh().up,...d.up}}}}catch(e){}
function save(){S.last=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ================= rules ================= */
const rank=()=>{let r=1;RANKS.forEach((t,i)=>{if(S.rep>=t)r=i+1});return r};
const showSlots=()=>3+rank();
const stockCap=(l=S.up.store)=>12+l*4;
const partySlots=()=>rank()>=3?2:1;
const adv=id=>S.advs.find(a=>a.id===id);
const busy=a=>S.runs.some(r=>r.party.includes(a.id));
const resting=a=>a.rest>S.clock;
const ready=a=>!busy(a)&&!resting(a);
const advPower=a=>{const d=AID[a.id],w=a.w;return Math.round(8+a.lv*4+(w?totalAtk(w)*(d.likes.includes(RID[w.r].type)?1.3:1):0))};
const floorOf=id=>S.floors[id]||1;
const isBoss=f=>f%5===0;
const dPower=(id,f=floorOf(id))=>Math.round(DID[id].base*(1+.12*(f-1))*(isBoss(f)?1.5:1));
const partyPower=ids=>ids.reduce((s,id)=>s+advPower(adv(id)),0);
const winRate=(ids,id)=>clamp(.5+(partyPower(ids)-dPower(id))/dPower(id)*.8,.08,.97);
const totalWorkers=()=>S.idle+MK.reduce((a,k)=>a+S.workers[k],0);
const hireCost=()=>Math.round(40*Math.pow(1.75,S.hires));
const gatherEvery=()=>40/(1+.3*S.up.net);
const guestEvery=()=>14/(1+.25*S.up.sign);
const smithSpeed=()=>S.up.smith?1+.2*(S.up.smith-1):1;
const craftTime=r=>(6+r.atk*.28)/smithSpeed();
const upCost=u=>Math.round(u.base*Math.pow(u.k,u.id==='forge'?S.up.forge-1:S.up[u.id]));
const upMaxed=u=>u.id==='forge'?S.up.forge>=u.max:S.up[u.id]>=u.max;
const value=it=>Math.round(RID[it.r].price*(1+.4*(it.st-1))*(it.atk/RID[it.r].atk)*(1+.25*it.plus)*(1+.1*S.up.lamp));
const shelfPrice=it=>Math.round(value(it)*POLICY[S.policy].m);
const totalAtk=it=>Math.round(it.atk*(1+.15*it.plus));
const night=()=>S.p>=.53&&S.p<.86;
const phaseName=p=>p<.2?'昼下がり':p<.36?'夕暮れ':p<.53?'マジックアワー':p<.86?'夜':'夜明け';
const canPay=need=>Object.entries(need).every(([k,n])=>S.mats[k]>=n);
const pay=need=>{for(const[k,n]of Object.entries(need))S.mats[k]-=n};
const shown=()=>S.items.filter(i=>i.shown);
const forgeBusy=()=>S.forge.length;
const stockFull=()=>S.items.length+S.forge.length>=stockCap();
function moteMat(){const n=phaseName(S.p);if(n==='夜')return Math.random()<.06?'comet':'star';if(n==='夕暮れ'||n==='マジックアワー')return Math.random()<.65?'dusk':'ore';return pick(['sky','cloud','ore'])}

/* ================= simulation (shared by live play and time away) ================= */
let LOG=[],away=null;
function note(kind,text){if(away){away[kind]=(away[kind]||0)+1;return}toast(text,kind==='bad'?'bad':'good')}
function newItem(r){const x=Math.random(),st=x<.6?1:x<.9?2:3;return{id:S.uid++,r:r.id,st,atk:Math.round(r.atk*rand(.88,1.15)*(1+.08*(st-1))),plus:0,shown:false}}
function startCraft(r){if(!canPay(r.need)||forgeBusy()>=S.up.forge||stockFull()||rank()<r.rank)return false;pay(r.need);S.forge.push({r:r.id,t:0,total:craftTime(r)});return true}
function tryBuy(cls,budget){
  const pool=shown().filter(it=>cls.likes.includes(RID[it.r].type)&&shelfPrice(it)<=budget);
  if(!pool.length)return null;
  const it=pool.reduce((a,b)=>totalAtk(b)>totalAtk(a)?b:a);
  if(Math.random()>POLICY[S.policy].p)return{item:it,ok:false};
  const price=shelfPrice(it);S.items=S.items.filter(x=>x!==it);S.gold+=price;S.sold++;S.rep+=it.st>=3?3:1;
  if(away){away.gold+=price;away.sold++}else{LOG.unshift({t:`${cls.who}が${RID[it.r].name}${it.plus?'+'+it.plus:''}を購入`,g:price});LOG=LOG.slice(0,5)}
  return{item:it,ok:true,price};
}
function launch(dg,party,repeat){S.runs.push({dg,party:[...party],end:S.clock+DID[dg].dur,repeat:!!repeat});if(!away)party.forEach((id,i)=>walkOut(id,i))}
function resolveRun(run){
  const d=DID[run.dg],f=floorOf(d.id),win=Math.random()<winRate(run.party,d.id),mult=(1+.15*(f-1))*(win?1:.3),got={};
  for(const[k,[lo,hi]]of Object.entries(d.loot)){const n=Math.round(rand(lo,hi)*mult);if(n>0){S.mats[k]+=n;got[k]=n;if(away)away.mats[k]=(away.mats[k]||0)+n}}
  const boss=isBoss(f);if(win){const rn=boss?(f===MAXF?2:1)+(Math.random()<.3?1:0):(Math.random()<.04+.006*f?1:0);if(rn){S.mats[d.rare]+=rn;got[d.rare]=rn;if(away)away.mats[d.rare]=(away.mats[d.rare]||0)+rn}}
  const gold=win?Math.round(rand(...d.gold)*(1+.15*(f-1))*(boss?3:1)):0;S.gold+=gold;
  const names=run.party.map(id=>AID[id].name).join('と');let text,broke=[];
  if(win){S.rep+=boss?10:2;if(boss){S.kills[d.id+f]=(S.kills[d.id+f]||0)+1;if(away)away.boss=(away.boss||0)+1}for(const id of run.party){const a=adv(id);a.xp++;if(a.xp>=a.lv*2){a.xp=0;a.lv++}}
    if(f<MAXF)S.floors[d.id]=f+1;text=boss?`${names}が${d.bosses[f]}を討伐`:`${names}が${d.name} ${f}階を突破`}
  else{for(const id of run.party){const a=adv(id);a.rest=S.clock+(boss?180:90);if(a.w&&Math.random()<(boss?.35:.2)){broke.push(RID[a.w.r].name);a.w=null}}
    text=boss?`${names}は${d.bosses[f]}に敗れた`:`${names}は${d.name} ${f}階で撤退`;run.repeat=false}
  const loot=Object.entries(got).map(([k,n])=>`${MATS[k].name}+${n}`).join(' ');
  S.dlog.unshift({win,t:text,loot:(gold?`${gold}G `:'')+loot+(broke.length?` ・ ${broke.join('、')}が折れた`:'')});S.dlog=S.dlog.slice(0,5);
  if(away){away.dg=(away.dg||0)+1;if(win)away.dgWin=(away.dgWin||0)+1;away.gold+=gold;return}
  toast(win?`${text}！ ${gold}G${got[d.rare]?` ・ ${MATS[d.rare].name}+${got[d.rare]}`:''}`:`${text}…`,win?'good':'bad');if(win&&boss){burst(shopX()+100*s,gy-120*s,[255,220,150],60);burst(shopX()+100*s,gy-120*s,hex(MATS[d.rare].c),40)}run.party.forEach((id,i)=>walkIn(id,i,win));
}
const budgetFor=()=>Math.round(60*Math.pow(1.7,rank()-1)*rand(.7,2));
function tick(dt,live){
  S.clock+=dt;S.p=mod(S.p+dt/180,1);
  // spirits gather
  for(const k of MK){const n=S.workers[k];if(!n)continue;const speed=k==='comet'?(night()?.2:0):1;
    S.acc[k]=(S.acc[k]||0)+dt*n*speed*(away?.5:1)/gatherEvery();while(S.acc[k]>=1){S.acc[k]--;S.mats[k]++;if(away)away.mats[k]=(away.mats[k]||0)+1}}
  // forge
  for(let i=S.forge.length-1;i>=0;i--){const j=S.forge[i];j.t+=dt;if(j.t>=j.total){S.forge.splice(i,1);const r=RID[j.r];S.crafted++;
    if(Math.random()<r.rate){const it=newItem(r);S.items.push(it);if(away)away.crafted++;else{toast(`${r.name} ${'★'.repeat(it.st)} ATK${it.atk} が鍛え上がった`,'good');forgeFx(true)}}
    else{if(away)away.failed++;else{toast(`${r.name}の鍛造に失敗… 素材は風に溶けた`,'bad');forgeFx(false)}}}}
  // apprentice smith
  if(S.up.smith&&S.smithOn){const r=RID[S.smithRecipe];if(r)while(startCraft(r)){}}
  // auto display
  if(S.autoShow){const free=showSlots()-shown().length;if(free>0){const cand=S.items.filter(i=>!i.shown).sort((a,b)=>value(b)-value(a)).slice(0,free);cand.forEach(i=>i.shown=true)}}
  while(shown().length>showSlots()){shown().sort((a,b)=>value(a)-value(b))[0].shown=false}
  // adventurers join as the shop grows
  for(const d of ADVS)if(d.rank<=rank()&&!adv(d.id)){S.advs.push({id:d.id,lv:1,xp:0,w:null,rest:0});if(!away)toast(`${d.job}の${d.name}が常連になった`,'good')}
  // dungeon runs
  for(const run of [...S.runs]){if(S.clock<run.end)continue;S.runs=S.runs.filter(r=>r!==run);resolveRun(run);
    if(run.repeat&&run.party.every(id=>{const a=adv(id);return a&&ready(a)}))launch(run.dg,run.party,true)}
  // requests
  S.reqT-=dt;if(S.reqT<=0){S.reqT=rand(60,90);if(S.requests.length<3){const avail=RECIPES.filter(r=>r.rank<=rank()&&!r.legend);const r=pick(avail);
    S.requests.push({id:S.uid++,who:pick(CLASSES.filter(c=>c.likes.includes(r.type))).who,r:r.id,min:Math.round(r.atk*rand(.9,1.08)),reward:Math.round(r.price*rand(2,2.6)),rep:5,end:S.clock+300})}}
  const before=S.requests.length;S.requests=S.requests.filter(q=>q.end>S.clock);if(!away&&S.requests.length<before)toast('依頼の期限が切れてしまった','bad');
  // customers
  S.guestT-=dt;if(S.guestT<=0){S.guestT=guestEvery()*rand(.7,1.3);const cls=pick(CLASSES),budget=budgetFor();
    if(live)spawnGuest(cls,budget);else tryBuy(cls,budget)}
}

    ctx.beginPath();const ax=x-6*s+i*(w+12*s)/10,aw=(w+12*s)/10;ctx.moveTo(ax,b-h+6*s);ctx.lineTo(ax+aw,b-h+6*s);ctx.lineTo(ax+aw,b-h+24*s);ctx.quadraticCurveTo(ax+aw/2,b-h+30*s,ax,b-h+24*s);ctx.fill()}
  // crossed-swords sign
  const sx=x+w+20*s,sy=b-h+8*s;ctx.fillStyle=body;ctx.fillRect(x+w,sy,24*s,2*s);
  ctx.fillStyle=rgb(mix([143,211,255],[40,60,110],k.dark*.5));ctx.beginPath();ctx.roundRect(sx-14*s,sy+6*s,28*s,56*s,3*s);ctx.fill();
  ctx.fillStyle=rgb([20,24,60]);ctx.font=`700 ${11*s}px "Shippori Mincho",serif`;ctx.textAlign='center';['空','色','堂'].forEach((c,i)=>ctx.fillText(c,sx,sy+30*s+i*12*s));
  drawWeapon('sword',sx-4*s,sy+16*s,14*s,'rgba(20,24,60,.9)');drawWeapon('sword',sx+4*s,sy+16*s,14*s,'rgba(20,24,60,.6)');
  // spirits circling the roof
  ctx.save();ctx.globalCompositeOperation='lighter';let n=0;
  for(const m of MK)for(let i=0;i<Math.min(S.workers[m],4);i++,n++){const a=time*.6+n*1.3,ox=x+w/2+Math.cos(a)*(w*.62),oy=b-h-30*s+Math.sin(a*1.7)*16*s,c=hex(MATS[m].c);
    const sg=ctx.createRadialGradient(ox,oy,0,ox,oy,9*s);sg.addColorStop(0,rgb(c,.95));sg.addColorStop(1,rgb(c,0));ctx.fillStyle=sg;ctx.fillRect(ox-9*s,oy-9*s,18*s,18*s)}
  ctx.restore();
}
function frame(now){
  const dt=Math.min(.05,(now-(frame.l||now))/1000);frame.l=now;time+=dt;
  tick(dt,true);
  const k=sky(S.p),x0=shopX();
  // guests walk to the window, look, then buy or leave
  for(const g of guests){const act=guests.filter(q=>q.state==='in'||q.state==='look');
    if(g.state==='in'){const tx=x0+228*s+act.indexOf(g)*44*s;g.walk+=dt*8;g.x-=Math.min(70*s*dt,g.x-tx);if(g.x-tx<1){g.state='look';g.wait=1.4}}
    else if(g.state==='look'){g.wait-=dt;if(g.wait<=0){const r=tryBuy(g.cls,g.budget);g.res=r&&r.ok?'buy':'pass';g.state='out';g.resT=1.6;
      if(r&&r.ok){g.carry=1;floatText(g.x,gy-100*s,`+${fmt(r.price)}G`,[255,196,107]);burst(g.x,gy-60*s,[255,196,107],18);render()}
      else if(r)floatText(g.x,gy-100*s,'ちょっと高いな',[200,210,255]);else floatText(g.x,gy-100*s,'いいのがないな',[200,210,255])}}
    else{g.resT-=dt;if(g.resT<0){g.walk+=dt*8;g.x-=70*s*dt}}}
  for(let i=guests.length-1;i>=0;i--)if(guests[i].x<-50*s)guests.splice(i,1);
  for(let i=walkers.length-1;i>=0;i--){const w=walkers[i];if(w.delay>0){w.delay-=dt;continue}w.walk+=dt*8;w.x+=w.dir*80*s*dt;
    if(w.dir>0&&w.x>W+40*s)walkers.splice(i,1);else if(w.dir<0&&w.x<=w.stop){if(w.win)burst(w.x,gy-60*s,[255,196,107],16);walkers.splice(i,1)}}
  // falling sky motes
  moteT-=dt;if(moteT<=0&&motes.length<6){moteT=rand(2,3.5);motes.push({x:W*rand(.08,.95),y:-10,m:moteMat(),ph:Math.random()*6,v:rand(14,26)*s})}
  for(let i=motes.length-1;i>=0;i--){const m=motes[i];m.y+=m.v*dt;m.ph+=dt;if(m.y>gy-6*s)motes.splice(i,1)}

  ctx.setTransform(DPR,0,0,DPR,0,0);
  const g=ctx.createLinearGradient(0,0,0,gy);g.addColorStop(0,rgb(k.top));g.addColorStop(.6,rgb(k.mid));g.addColorStop(1,rgb(k.hor));ctx.fillStyle=g;ctx.fillRect(0,0,W,gy);
  if(k.stars>0)for(const st of starsArr){const a=k.stars*(.5+.5*Math.sin(time*1.5+st.tw));ctx.fillStyle=`rgba(255,250,240,${a})`;ctx.fillRect(st.x,st.y,st.r*1.5,st.r*1.5)}
  if(k.stars>.4){const a=(k.stars-.4)/.6,hx=W*.16,hy=gy*.3;ctx.save();ctx.globalCompositeOperation='lighter';
    for(let i=0;i<3;i++){const lg=ctx.createLinearGradient(hx,hy,W*.9,-20);lg.addColorStop(0,`rgba(200,240,255,${a*(.7-i*.2)})`);lg.addColorStop(1,'rgba(150,180,255,0)');
      ctx.strokeStyle=lg;ctx.lineWidth=(1.5+i*5)*s;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(hx,hy);ctx.quadraticCurveTo(W*.5,gy*.15,W*.95,-20-i*8*s);ctx.stroke()}ctx.restore()}
  const sx=W*.82,sy=gy*k.sunY+gy*.05,vis=clamp((gy-sy)/(40*s),0,1);
  if(vis>0){ctx.save();ctx.globalCompositeOperation='lighter';const sg=ctx.createRadialGradient(sx,sy,0,sx,sy,260*s);sg.addColorStop(0,rgb(k.sun,.9*vis));sg.addColorStop(.12,rgb(k.sun,.35*vis));sg.addColorStop(1,rgb(k.sun,0));
    ctx.fillStyle=sg;ctx.fillRect(0,0,W,gy);for(let i=0;i<12;i++){const a=i*Math.PI/6+(reduce?0:time*.04),len=(i%2?90:180)*s,lg=ctx.createLinearGradient(sx,sy,sx+Math.cos(a)*len,sy+Math.sin(a)*len);
      lg.addColorStop(0,rgb(k.sun,.5*vis));lg.addColorStop(1,rgb(k.sun,0));ctx.strokeStyle=lg;ctx.lineWidth=(i%2?1:1.8)*s;ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx+Math.cos(a)*len,sy+Math.sin(a)*len);ctx.stroke()}ctx.restore()}
  for(const c of CL){const span=W/s+600,x=(mod(c.x-time*c.sp,span)-300)*s,y=gy*c.yf,sc=s;let dx=sx-x,dy=sy-y;const d=Math.hypot(dx,dy)||1;dx/=d;dy/=d;const w=c.w*s,near=clamp(1-d/(W*.9),0,1)*vis;
    const cg=ctx.createLinearGradient(x+dx*w*.5,y+dy*w*.35,x-dx*w*.5,y-dy*w*.35);cg.addColorStop(0,rgb(mix(k.lit,[255,255,255],near*.4)));cg.addColorStop(.45,rgb(mix(k.lit,k.shd,.55)));cg.addColorStop(1,rgb(k.shd));
    ctx.fillStyle=cg;ctx.beginPath();for(const p of c.puffs){ctx.moveTo(x+p.x*sc+p.r*sc,y+p.y*sc);ctx.arc(x+p.x*sc,y+p.y*sc,p.r*sc,0,6.283)}ctx.fill()}
  ctx.fillStyle=rgb(mix(k.mid,[8,10,40],.6));for(let i=0;i<W/(22*s)+1;i++){const r=rng(i*31)();if(r<.35)continue;const h=(10+r*r*70)*s;ctx.fillRect(i*22*s,gy-h,18*s,h)}
  ctx.fillStyle=ctx.strokeStyle=rgb(mix([14,12,40],[4,4,16],k.dark));const poles=[W*.04,W*.6,W*1.05];
  for(const px of poles){ctx.fillRect(px-2*s,gy-180*s,4*s,180*s);ctx.fillRect(px-18*s,gy-168*s,36*s,3*s)}
  ctx.lineWidth=1*s;ctx.beginPath();for(let j=0;j<poles.length-1;j++)for(const o of[-16,-4,8,16]){const y=gy-167*s;ctx.moveTo(poles[j]+o*s,y);ctx.quadraticCurveTo((poles[j]+poles[j+1])/2,y+16*s,poles[j+1]+o*s,y)}ctx.stroke();
  const gg=ctx.createLinearGradient(0,gy,0,H);gg.addColorStop(0,rgb(mix(k.shd,[16,14,40],.55)));gg.addColorStop(1,rgb(mix(k.shd,[4,4,16],.85)));ctx.fillStyle=gg;ctx.fillRect(0,gy,W,H-gy);
  ctx.save();ctx.globalCompositeOperation='lighter';const rg=ctx.createRadialGradient(sx,gy+10*s,0,sx,gy+10*s,W*.3);rg.addColorStop(0,rgb(k.sun,.4*vis));rg.addColorStop(1,rgb(k.sun,0));ctx.fillStyle=rg;ctx.fillRect(0,gy,W,H-gy);ctx.restore();
  ctx.fillStyle=`rgba(6,8,40,${k.dark*.4})`;ctx.fillRect(0,gy-220*s,W,H);
  drawShop(k);
  const sil=rgb(mix([26,22,66],[6,6,22],k.dark)),rim=rgb(mix(k.sun,[180,190,255],k.dark),.85*(1-k.dark*.5));
  for(const gu of guests){drawPerson(gu.x,gy+2*s,{...gu.cls,carry:gu.carry},rim,1.4*s,-.7*s,gu.walk);drawPerson(gu.x,gy+2*s,{...gu.cls,carry:gu.carry},sil,0,0,gu.walk);
    if(gu.state==='look'){const bx=gu.x,by=gy-(104*gu.cls.h+16)*s;ctx.fillStyle='rgba(10,14,50,.78)';ctx.beginPath();ctx.roundRect(bx-14*s,by-14*s,28*s,24*s,7*s);ctx.fill();
      drawWeapon(gu.cls.likes[0],bx,by-2*s,18*s,'#cfe9ff')}}
  for(const w of walkers){if(w.delay>0)continue;const lk={...w.look,carry:w.carry};drawPerson(w.x,gy+2*s,lk,rim,1.4*s,-.7*s,w.walk);drawPerson(w.x,gy+2*s,lk,sil,0,0,w.walk);
    if(w.dir<0&&w.win){ctx.fillStyle='rgba(255,196,107,.9)';ctx.beginPath();ctx.arc(w.x+10*s,gy-40*s*w.look.h,5*s,0,6.283);ctx.fill()}}
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(const m of motes){const x=m.x+Math.sin(m.ph*1.5)*8*s,c=hex(MATS[m.m].c),r=(m.m==='comet'?9:6)*s,pul=.75+.25*Math.sin(m.ph*5);m.dx=x;
    const mg=ctx.createRadialGradient(x,m.y,0,x,m.y,r*3);mg.addColorStop(0,rgb(c,pul));mg.addColorStop(.3,rgb(c,.5*pul));mg.addColorStop(1,rgb(c,0));ctx.fillStyle=mg;ctx.fillRect(x-r*3,m.y-r*3,r*6,r*6);
    ctx.fillStyle='rgba(255,255,255,.95)';ctx.beginPath();ctx.arc(x,m.y,r*.35,0,6.283);ctx.fill()}
  for(let i=fx.length-1;i>=0;i--){const f=fx[i];f.t+=dt;
    if(f.text){const a=1-f.t/1.6;if(a<=0){fx.splice(i,1);continue}ctx.globalCompositeOperation='source-over';ctx.fillStyle=rgb(f.c,a);ctx.font=`700 ${12*s}px "Zen Kaku Gothic New",sans-serif`;ctx.textAlign='center';ctx.fillText(f.text,f.x,f.y-f.t*24*s);ctx.globalCompositeOperation='lighter';continue}
    f.x+=f.vx*dt;f.y+=f.vy*dt;if(!f.ember)f.vy+=50*s*dt;const a=1-f.t/(f.ember?1.4:1.1);if(a<=0){fx.splice(i,1);continue}ctx.fillStyle=rgb(f.c,a);ctx.fillRect(f.x,f.y,2*s,2*s)}
  ctx.restore();
  // ui
  frame.q=(frame.q||0)+dt;if(frame.q>.4){frame.q=0;const sg=structSig();if(sg!==sig){sig=sg;render()}else refresh()}
  frame.sv=(frame.sv||0)+dt;if(frame.sv>5){frame.sv=0;save()}
  requestAnimationFrame(frame);
}

/* ================= time away ================= */
function offline(){
  const sec=clamp((Date.now()-S.last)/1000,0,8*3600);if(sec<60)return;
  away={gold:0,sold:0,crafted:0,failed:0,mats:{}};const step=5;
  for(let t=0;t<sec;t+=step)tick(Math.min(step,sec-t),false);
  const a=away;away=null;const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60);
  $('wTime').textContent=`${h?h+'時間':''}${m}分のあいだ、店は回り続けていました。`;
  $('wGold').textContent=`+${fmt(a.gold)}G`;
  const lines=[];if(a.sold)lines.push(`売れた武器 ${a.sold}本`);if(a.crafted)lines.push(`鍛え上がった武器 ${a.crafted}本${a.failed?`（失敗 ${a.failed}回）`:''}`);
  if(a.dg)lines.push(`ダンジョン挑戦 ${a.dg}回（成功 ${a.dgWin||0}回${a.boss?`・ボス討伐 ${a.boss}回`:''}）`);const mats=Object.entries(a.mats).filter(([,n])=>n>0).map(([k,n])=>`${MATS[k].name}+${n}`);if(mats.length)lines.push(mats.join('　'));
  if(!lines.length)lines.push('静かな時間でした。精霊を素材に割り当てると、留守中も素材が集まります。');
  $('wList').innerHTML=lines.map(l=>`<li>${l}</li>`).join('');$('welcome').hidden=false;
}
$('claim').addEventListener('click',()=>{$('welcome').hidden=true;render();save()});

addEventListener('resize',resize);resize();offline();render();sig=structSig();
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
requestAnimationFrame(frame);
})();
