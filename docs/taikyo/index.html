<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>退去シミュレーター</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b2622;--paper:#fffaf0;--line:#d9cdb8;--accent:#e2573b;--ok:#2f8f5b;--blue:#2f6fae;--muted:#7d7266}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#dfe9ef;font-family:'M PLUS Rounded 1c','Hiragino Maru Gothic ProN',system-ui,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;touch-action:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer;border:0}
.hidden{display:none!important}
#hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 12px 0;pointer-events:none}
.chip{pointer-events:auto;background:rgba(255,250,240,.94);border:2px solid var(--ink);border-radius:12px;padding:6px 10px;box-shadow:0 3px 0 rgba(0,0,0,.18);font-weight:800;font-size:14px;line-height:1.3}
.chip small{display:block;font-weight:500;font-size:11px;color:var(--muted)}
#clock b{font-size:20px}
#rightHud{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
#docsBtn,#backBtn,#startInspBtn{pointer-events:auto}
#docsBtn{background:#fff3c4}
#hearts{color:var(--accent);letter-spacing:1px}
#found{position:fixed;left:12px;top:calc(76px + env(safe-area-inset-top));pointer-events:none}
#backBtn{position:fixed;left:12px;bottom:calc(16px + env(safe-area-inset-bottom));background:#fff;font-weight:800}
#startInspBtn{position:fixed;right:12px;bottom:calc(16px + env(safe-area-inset-bottom));background:var(--accent);color:#fff;font-weight:800;font-size:15px;padding:10px 14px}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(70px + env(safe-area-inset-bottom));background:rgba(43,38,34,.82);color:#fff;border-radius:20px;padding:6px 14px;font-size:13px;pointer-events:none;white-space:nowrap}
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));width:min(560px,calc(100% - 20px));background:var(--paper);border:3px solid var(--ink);border-radius:16px;padding:14px 14px 12px;box-shadow:0 6px 0 rgba(0,0,0,.2)}
.sheet h3{margin:0 0 4px;font-size:18px}
.sheet p{margin:0 0 10px;font-size:14px;line-height:1.6}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{background:#fff;border:2px solid var(--ink);border-radius:10px;padding:8px 12px;font-weight:800;font-size:14px;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.btn.primary{background:var(--accent);color:#fff}
.btn.good{background:#e6f4ea}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn small{font-weight:500;font-size:11px;margin-left:4px}
#dialog .who{display:inline-block;background:var(--ink);color:#fff;border-radius:8px;padding:2px 10px;font-size:12px;font-weight:800;margin-bottom:6px}
#dialog .who.me{background:var(--blue)}
#dialog .bill{display:flex;justify-content:space-between;align-items:center;background:#fff;border:2px dashed var(--line);border-radius:10px;padding:6px 10px;margin:0 0 10px;font-weight:800}
#dialog .bill .amt{color:var(--accent);font-size:20px}
#dialog .bill .amt.zero{color:var(--ok)}
#dialog .choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#dialog .choices .btn{text-align:left;font-size:13px;padding:8px 10px}
#dialog .choices .btn.acc{grid-column:1/-1;text-align:center;background:#f1ece2}
.overlay{position:fixed;inset:0;background:rgba(30,26,22,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.panel{background:var(--paper);border:3px solid var(--ink);border-radius:18px;width:min(560px,100%);max-height:calc(100% - 20px);overflow:auto;padding:18px;box-shadow:0 8px 0 rgba(0,0,0,.25);-webkit-user-select:text;user-select:text;touch-action:pan-y}
.logo{font-size:34px;font-weight:800;line-height:1.15;text-align:center;margin:6px 0 4px}
.logo small{display:block;font-size:15px;color:var(--accent)}
.tag{text-align:center;font-size:14px;line-height:1.8;margin:10px 0 16px}
.center{text-align:center}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tabs button{background:#efe7d8;border:2px solid var(--ink);border-radius:10px;padding:6px 10px;font-weight:800;font-size:13px}
.tabs button.on{background:var(--ink);color:#fff}
.doc{font-size:14px;line-height:1.7}
.doc h4{margin:10px 0 4px;font-size:15px}
.doc ul{margin:0;padding-left:20px}
.doc table{border-collapse:collapse;width:100%}
.doc td{border-bottom:1px solid var(--line);padding:4px 2px;vertical-align:top}
.stamp{display:inline-block;border:2px solid var(--accent);color:var(--accent);border-radius:6px;padding:0 6px;font-weight:800;font-size:12px;transform:rotate(-4deg)}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.album figure{margin:0;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px;font-size:12px}
.album .ph{height:90px;border-radius:4px;background:#efe9df center/contain no-repeat}
.res table{width:100%;border-collapse:collapse;font-size:13px}
.res td,.res th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.res th{font-size:12px;color:var(--muted)}
.res .num{text-align:right;white-space:nowrap}
.res s{color:var(--muted)}
.res .why{font-size:12px;color:var(--muted);line-height:1.5}
.big{font-size:30px;font-weight:800}
.rank{font-size:56px;font-weight:800;color:var(--accent);line-height:1}
.guide{background:#f4f8ef;border:1px solid #cfe0c2;border-radius:10px;padding:8px 10px;font-size:12.5px;line-height:1.6;margin:0 0 10px;-webkit-user-select:text;user-select:text}
.guide>div+div{margin-top:4px}
.guide .links{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.guide .links a{display:inline-block;background:#fff;border:1.5px solid #e59a2b;color:#8a4b00;border-radius:999px;padding:2px 10px;text-decoration:none;font-weight:800}
.guide .links span{font-size:11px;color:var(--muted)}
.res .guide{margin:6px 0 0}
details.real summary{cursor:pointer;font-size:12px;color:var(--blue);font-weight:800;margin-top:4px}
#spotSheet{max-height:70vh;overflow:auto;touch-action:pan-y}
#toast{position:fixed;left:50%;top:calc(90px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:12px;padding:8px 14px;font-weight:800;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hidden">
  <div class="chip" id="clock"><small id="phaseLbl">準備</small><b id="clockTxt">9:00</b> <span id="clockSub" style="font-size:11px;font-weight:500">立ち会い 12:00</span></div>
  <div id="rightHud">
    <div class="chip" id="depositChip"><small>敷金</small><span id="depTxt"></span></div>
    <div class="chip hidden" id="heartChip"><small>信用</small><span id="hearts"></span></div>
    <button class="chip" id="docsBtn" type="button">📄 書類</button>
  </div>
</div>
<div class="chip hidden" id="found"></div>
<button class="chip hidden" id="backBtn" type="button">← 部屋全体</button>
<button class="chip hidden" id="startInspBtn" type="button">立ち会いを始める ▶</button>
<div id="hint" class="hidden">ドラッグで回転・タップで調べる</div>

<div id="spotSheet" class="sheet hidden">
  <h3 id="spotName"></h3>
  <p id="spotDesc"></p>
  <div class="btns" id="spotBtns"></div>
</div>

<div id="dialog" class="sheet hidden">
  <div class="who" id="dlgWho">業者</div>
  <p id="dlgText"></p>
  <div class="bill hidden" id="dlgBill"><span id="dlgLabel"></span><span class="amt" id="dlgAmt"></span></div>
  <div class="choices" id="dlgChoices"></div>
</div>

<div id="title" class="overlay">
  <div class="panel">
    <div class="logo">退去シミュレーター<small>〜 敷金を守りぬけ 〜</small></div>
    <div class="tag">今日はアパートの退去日。<br>12時に、管理会社の業者が立ち会いに来る。<br><b>午前中に部屋を片づけ</b>、立ち会いでは<br><b>不当な請求に言い返して</b>、敷金を取り戻そう。</div>
    <div class="center"><button class="btn primary" id="startBtn" type="button" style="font-size:18px;padding:10px 26px">はじめる</button></div>
  </div>
</div>

<div id="docs" class="overlay hidden">
  <div class="panel">
    <div class="tabs" id="docTabs">
      <button data-t="contract" class="on" type="button">契約書</button>
      <button data-t="album" type="button">入居時チェック表</button>
      <button data-t="guide" type="button">ガイドラインメモ</button>
      <button data-t="real" type="button">実際の退去ガイド</button>
    </div>
    <div class="doc" id="docBody"></div>
    <div class="center" style="margin-top:12px"><button class="btn" id="docsClose" type="button">閉じる</button></div>
  </div>
</div>

<div id="result" class="overlay hidden">
  <div class="panel res" id="resBody"></div>
</div>

<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
const $ = s => document.querySelector(s);
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const yen = n => '¥' + Math.round(n).toLocaleString();
const sleep = ms => new Promise(r => setTimeout(r, ms));

// ---------- 部屋の寸法（内側）----------
const RX = 1.8, RZ = 2.7, RH = 2.4;
// 水回り（左の壁の向こう）：洗面所 z>PZ、浴室 z<PZ
const WX0 = -3.6, BZ = 0.5, PZ = 1.55;
const START_MIN = 9 * 60, END_MIN = 12 * 60;

// ---------- 契約と、その回の状態 ----------
let C, S;
function newContract() {
  const rent = pick([52000, 58000, 64000, 70000]);
  return {
    rent, deposit: rent * 2, years: pick([2, 3, 4, 5, 7]),
    smoker: Math.random() < 0.3, cleaningClause: Math.random() < 0.5, keyLost: Math.random() < 0.25,
  };
}
// クロスは6年で残存価値1円（経過年数を考慮した負担額）
const depRate = () => Math.max(0, 1 - C.years / 6);
const dep = base => C.years >= 6 ? 1 : Math.max(1, Math.round(base * depRate() / 100) * 100);
const depLabel = () => `入居${C.years}年を考慮`;
const depReply = () => C.years >= 6
  ? `…入居${C.years}年だと、クロスの価値はもう残ってないですね。1円にしておきます。`
  : `…入居${C.years}年なら、クロスの価値は${Math.round(depRate() * 100)}%残りですね。その分だけにします。`;

// ---------- 傷・汚れの定義 ----------
// kind: owner=通常損耗（貸主負担） tenant=借主負担 premove=入居前から
// steps: 正しく言い返すと進む減額の段階。k は有効な言い分
const CLOTH = 15000;
const DEFS = {
  pins: { name: '画鋲の穴', wall: 'L', pos: [-RX, 1.5, -2.05], size: [.5, .4], kind: 'owner',
    desc: 'カレンダーを貼っていた画鋲の小さな穴がいくつかある。',
    claim: () => ({ say: '壁に画鋲の穴がありますね。クロスの張替えになります。', label: 'クロス張替え（1面）', amt: CLOTH,
      steps: [{ k: 'normal', amt: 0, reply: '…まあ、画鋲くらいなら普通の生活の範囲ですね。これは結構です。' }] }),
    why: '画鋲・ピンの穴（下地ボードの張替えが要らない程度）は通常損耗で、貸主の負担。' },
  sunburn: { name: 'ポスターの日焼け跡', wall: 'B', pos: [-1.33, 1.4, -RZ], size: [.62, .82], kind: 'owner',
    desc: 'ポスターを貼っていた所だけ白く、まわりが日に焼けている。',
    claim: () => ({ say: 'ポスターの跡がくっきり残ってますね。張替えです。', label: 'クロス張替え（1面）', amt: CLOTH,
      steps: [{ k: 'normal', amt: 0, reply: '…日焼けは住んでいれば仕方ないですね。わかりました。' }] }),
    why: '日差しによるクロスの変色（ポスターの跡を含む）は通常損耗で、貸主の負担。' },
  fridge: { name: '冷蔵庫の後ろの黒ずみ', wall: 'R', pos: [RX, 1.0, 0.75], size: [.7, 1.3], kind: 'owner',
    desc: '冷蔵庫を置いていた後ろの壁が、黒く変色している。',
    claim: () => ({ say: '冷蔵庫の裏、真っ黒ですね。ここは張替えさせてもらいます。', label: 'クロス張替え（1面）', amt: CLOTH,
      steps: [{ k: 'normal', amt: 0, reply: '…電気ヤケは冷蔵庫を使えば出ますからね。結構です。' }] }),
    why: '冷蔵庫など家電の後ろの壁の黒ずみ（電気ヤケ）は通常損耗で、貸主の負担。' },
  dents: { name: 'ベッドの脚のへこみ', wall: 'F0', pos: [-1.3, 0, -1.65], size: [1.0, 2.0], kind: 'owner',
    desc: 'ベッドを置いていた所の床に、脚の跡のへこみが4つある。',
    claim: () => ({ say: '床にへこみが4か所。フローリングの補修ですね。', label: 'フローリング補修', amt: 22000,
      steps: [{ k: 'normal', amt: 0, reply: '…家具を置いた跡ですか。それは普通の使い方ですね。' }] }),
    why: '家具を置いたことによる床のへこみや跡は通常損耗で、貸主の負担。' },
  screw: { name: '棚を付けたネジ穴', wall: 'R', pos: [RX, 1.6, -2.0], size: [.42, .32], kind: 'tenant',
    desc: '壁に棚を付けたときのネジ穴が4つ。下地のボードまで穴があいている。',
    fix: { label: 'パテで埋める', t: 30, rate: 0.7 },
    claim: s => ({ say: s.patchFail ? 'ネジ穴、自分で埋めました？ 色が違ってかえって目立ちますね。部屋全体で張替えます。'
        : 'ネジ穴ですね。ボードまで開いてますから、部屋全体のクロス張替えです。',
      label: 'クロス張替え（部屋全面）', amt: 60000,
      steps: [{ k: 'partial', amt: CLOTH, label: 'クロス張替え（1面）', reply: '…確かに、張替えはその面だけで足りますね。1面分にします。' },
              { k: 'dep', amt: dep(CLOTH), label: `クロス1面（${depLabel()}）`, reply: depReply() }] }),
    why: 'ネジ穴・くぎ穴（ボードの張替えが必要な程度）は借主の負担。ただし負担は傷んだ面の分だけで、クロスは6年で価値がほぼ1円になる。' },
  caster: { name: '椅子のキャスター傷', wall: 'F0', pos: [0.95, 0, -1.55], size: [1.0, 1.0], kind: 'tenant',
    desc: '机の椅子を動かしていた所の床に、こすれた傷が広がっている。',
    claim: () => ({ say: 'キャスターの傷ですね。床は全部張替えになります。', label: 'フローリング張替え（全面）', amt: 110000,
      steps: [{ k: 'partial', amt: 28000, label: 'フローリング部分補修', reply: '…まあ、傷の範囲だけの補修でいけますね。' }],
      rebut: { dep: 'フローリングの部分補修は、住んだ年数は関係ないんですよ。' } }),
    why: 'キャスター付きの椅子などによる床の傷は借主の負担。ただし補修は傷の範囲だけで、フローリングの部分補修は経過年数を考慮しない。' },
  hole: { name: '壁の穴', wall: 'R', pos: [RX, 0.45, -0.6], size: [.32, .32], kind: 'tenant',
    desc: '物をぶつけて、壁に穴があいてしまった。自分では直せそうにない。',
    claim: () => ({ say: '穴があいてますね。ボードの補修と、クロスは部屋全体で張替えです。', label: 'ボード補修＋クロス全面', amt: 72000,
      steps: [{ k: 'partial', amt: 12000 + CLOTH, label: 'ボード補修＋クロス1面', reply: '…そうですね、張替えはこの面だけにしましょう。' },
              { k: 'dep', amt: 12000 + dep(CLOTH), label: `ボード補修＋クロス1面（${depLabel()}）`, reply: '…クロス分は年数で割り引きます。ボードの補修代はそのままですよ。' }] }),
    why: '不注意で開けた穴は借主の負担。ただしクロスは面の分だけで、経過年数も考慮する（ボードの補修代は別）。' },
  stain: { name: 'ジュースのシミ', wall: 'F0', pos: [0.2, 0, 0.45], size: [.6, .6], kind: 'tenant',
    desc: 'こぼしたジュースを放っておいたシミ。がんばれば落ちそう。', clean: { label: 'シミ抜きをする', t: 40 },
    claim: () => ({ say: '床にシミがありますね。こぼしたのを放っておきました？ 補修します。', label: 'フローリングのシミ補修', amt: 18000, steps: [],
      rebut: { normal: '飲みこぼしを放っておいたシミは、普通の使い方とは言えないですね。' } }),
    why: '飲みこぼしなどを放置してできたシミは借主の負担。退去前に落とせば請求されない。' },
  grease: { name: 'コンロまわりの油汚れ', wall: 'R', pos: [RX, 1.2, 2.2], size: [.62, .5], kind: 'tenant',
    desc: 'コンロの奥の壁に油がこびりついている。洗剤でこすれば落ちそう。', clean: { label: '油汚れを落とす', t: 30 },
    claim: () => ({ say: 'コンロまわり、油でギトギトですね。クリーニング代をいただきます。', label: 'キッチン油汚れの清掃', amt: 16500, steps: [],
      rebut: { normal: '掃除をしないで溜まった油汚れは、お手入れ不足ですから。' } }),
    why: '手入れを怠ってこびりついた油汚れは借主の負担。退去前に落とせば請求されない。' },
  mold: { name: '窓際のカビ', wall: 'B', pos: [1.15, 0.3, -RZ], size: [.62, .5], kind: 'tenant',
    desc: '結露を放っておいたせいで、窓の横の壁に黒いカビが出ている。', clean: { label: 'カビを落とす', t: 30 },
    claim: () => ({ say: '窓のところ、カビが広がってますね。張替えです。', label: 'クロス張替え（1面）', amt: CLOTH,
      steps: [{ k: 'dep', amt: dep(CLOTH), label: `クロス1面（${depLabel()}）`, reply: depReply() }],
      rebut: { normal: '結露を拭かずに放っておいてカビを広げたのは、住む人の管理の問題ですね。' } }),
    why: '結露そのものは建物の問題でも、放置してカビを広げたら借主の負担。ただしクロスは経過年数を考慮する。' },
  scribble: { name: '壁の落書き', wall: 'L', pos: [-RX, 0.6, 0.95], size: [.6, .45], kind: 'tenant',
    desc: '遊びに来た甥っ子がクレヨンで描いた落書き。消せるかもしれない。', clean: { label: '消しゴムで消す', t: 20 },
    claim: () => ({ say: 'クレヨンの落書きですね。張替えです。', label: 'クロス張替え（1面）', amt: CLOTH,
      steps: [{ k: 'dep', amt: dep(CLOTH), label: `クロス1面（${depLabel()}）`, reply: depReply() }],
      rebut: { normal: '落書きは普通の使い方じゃないですね。' } }),
    why: '落書きは借主の負担（クロスなので経過年数は考慮する）。消せるうちに消しておくのが一番。' },
  doorScratch: { name: '玄関ドアの傷', wall: 'F', pos: [0.47, 0.32, RZ], size: [.42, .26], kind: 'premove',
    desc: '玄関ドアの下の方に傷がある。…入居したときからあった気がする。',

function texCanvas(w, h, draw) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.encoding = THREE.sRGBEncoding;
  t.anisotropy = 4;
  t.userData = { canvas: c };
  return t;
}
const rnd = (a, b) => a + Math.random() * (b - a);

const floorTex = texCanvas(512, 512, (g, w, h) => {
  const rows = 8;
  for (let r = 0; r < rows; r++) {
    let x = -rnd(0, 200);
    while (x < w) {
      const len = rnd(160, 300), l = rnd(58, 68);
      g.fillStyle = `hsl(32,45%,${l}%)`;
      g.fillRect(x, r * h / rows, len, h / rows);
      g.globalAlpha = .12;
      for (let i = 0; i < 6; i++) { g.fillStyle = i % 2 ? '#7a5130' : '#f6d9a8'; g.fillRect(x, r * h / rows + rnd(2, h / rows - 2), len, 1.5); }
      g.globalAlpha = 1;
      g.fillStyle = 'rgba(80,50,25,.45)';
      g.fillRect(x, r * h / rows, 2, h / rows);
      x += len;
    }
    g.fillStyle = 'rgba(80,50,25,.35)';
    g.fillRect(0, r * h / rows, w, 2);

const NORMALS = { B: [0, 0, 1], F: [0, 0, -1], L: [1, 0, 0], R: [-1, 0, 0], F0: [0, 1, 0], L2: [1, 0, 0], B2: [0, 0, 1] };

const insp = makeInspector();

function walkTo(x, z) { return new Promise(r => { inspTarget = new THREE.Vector3(x, 0, z); inspResolve = r; }); }

// ---------- カメラ ----------
const cam = { az: -0.72, pol: 0.92, r: 9.6, target: new THREE.Vector3(-0.9, 0.5, 0), focus: null };
const camPos = new THREE.Vector3(), camLook = new THREE.Vector3(-0.9, 0.5, 0);
function overviewPos(out) { return out.set(cam.target.x + cam.r * Math.sin(cam.pol) * Math.sin(cam.az), cam.target.y + cam.r * Math.cos(cam.pol), cam.target.z + cam.r * Math.sin(cam.pol) * Math.cos(cam.az)); }
overviewPos(camPos);
function clampIn(v) { v.x = Math.max(-RX + 0.25, Math.min(RX - 0.25, v.x)); v.z = Math.max(-RZ + 0.25, Math.min(RZ - 0.25, v.z)); v.y = Math.min(RH - 0.15, v.y); return v; }

  // 浴室は狭いので、洗面所の上から見下ろす

  if (inWet(p)) return { pos: new THREE.Vector3(-1.1, 1.9, p.z - 0.2), look: p };
  if (def.wall === 'F0' || def.obj) {
    const toC = new THREE.Vector3(-p.x, 0, -p.z * 0.6).normalize();
    if (toC.lengthSq() < 0.01) toC.set(0, 0, -1);
    return { pos: clampIn(p.clone().addScaledVector(toC, 1.7).add(new THREE.Vector3(0, 1.9, 0))), look: p };
  }
  const side = new THREE.Vector3().crossVectors(n, new THREE.Vector3(0, 1, 0));

}

  else { const n = new THREE.Vector3(...NORMALS[def.wall]); s = p.clone().addScaledVector(n, 0.7).addScaledVector(new THREE.Vector3().crossVectors(n, new THREE.Vector3(0, 1, 0)), -0.55); }

}
function focusOn(view) { cam.focus = view; $('#backBtn').classList.toggle('hidden', !view || S.phase !== 'prep'); }

// 操作：ドラッグで回転、ピンチ・ホイールで寄る、タップで調べる
const ptrs = new Map(); let downAt = null, moved = 0, pinch0 = 0;
canvas.addEventListener('pointerdown', e => { canvas.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY }); downAt = { x: e.clientX, y: e.clientY }; moved = 0; if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch0 = Math.hypot(a.x - b.x, a.y - b.y); } });
canvas.addEventListener('pointermove', e => {
  const p = ptrs.get(e.pointerId); if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY; moved += Math.abs(dx) + Math.abs(dy);
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y); if (pinch0) cam.r = Math.max(4.5, Math.min(14, cam.r * pinch0 / d)); pinch0 = d; return; }
  if (moved > 6 && !cam.focus && S && S.phase === 'prep') { cam.az -= dx * 0.008; cam.pol = Math.max(0.35, Math.min(1.25, cam.pol - dy * 0.006)); }
  else if (moved > 6 && cam.focus && S && S.phase === 'prep') { focusOn(null); closeSheet(); }
});
canvas.addEventListener('pointerup', e => { ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch0 = 0; if (moved <= 6 && downAt && ptrs.size === 0) onTap(e.clientX, e.clientY); });

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();

function onTap(x, y) {
  if (!S || S.phase !== 'prep') return;
  ndc.set(x / innerWidth * 2 - 1, -(y / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects(spots.filter(s => !s.done).map(s => s.hit), true).filter(h => shown(h.object));
  if (!hits.length) { if (cam.focus) { focusOn(null); closeSheet(); } return; }

  openSpot(o.userData.spot);
}

// ---------- 一回分を作る ----------
function buildRound() {
  for (const s of spots) { s.mesh.parent && s.mesh.parent.remove(s.mesh); if (s.hit !== s.mesh) s.hit.parent && s.hit.parent.remove(s.hit); if (s.marker) scene.remove(s.marker); }
  for (const y of yellowing) y.parent.remove(y);
  spots = []; yellowing = []; decalSeq = 0;
  C = newContract();
  S = { phase: 'prep', clock: START_MIN, hearts: 3, vacuumed: false, patchFail: false, log: [] };
  const ids = [
    ...shuffle(['pins', 'sunburn', 'fridge', 'dents']).slice(0, 3),
    ...shuffle(['screw', 'caster', 'hole']).slice(0, 2),
    ...shuffle(['stain', 'grease', 'mold', 'scribble']).slice(0, 3),
    ...shuffle(['bathMold', 'mirrorScale', 'drainHair']).slice(0, 2),
    pick(['faucetLeak', 'cfDent']),
    pick(['doorScratch', 'entranceDent', 'sinkCrack']),
    'trash', 'dust',
  ];
  if (C.smoker) { ids.push('nicotine'); addYellowing(); }
  for (const id of ids) {
    const def = DEFS[id];
    let mesh, hit;
    if (id === 'trash') { mesh = makeTrash(); scene.add(mesh); hit = mesh; }
    else if (id === 'dust') { mesh = makeDust(); scene.add(mesh); hit = mesh; }
    else {
      mesh = makeDecal(id, def);
      const g = def.wall === 'F0' ? scene : walls[def.wall];
      g.add(mesh);
      // 小さい絵でもタップしやすいよう、見えない当たり板を重ねる
      hit = new THREE.Mesh(new THREE.PlaneGeometry(Math.max(.55, def.size[0]), Math.max(.55, def.size[1])), new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false }));
      hit.position.copy(mesh.position); hit.quaternion.copy(mesh.quaternion); g.add(hit);
    }
    const spot = { id, def, mesh, hit, found: false, done: false };
    hit.userData.spot = spot; mesh.userData.spot = spot;
    spots.push(spot);
  }
  S.album = shuffle([...spots.filter(s => s.def.kind === 'premove').map(s => ({ name: s.def.name, note: '傷あり', tex: s.mesh.material.map })), ...shuffle(DECOYS.slice()).slice(0, 2).map(([n, t]) => ({ name: n, note: t }))]);
  updateHud();
}

}

function fadeOut(obj, ms = 900) {

      <li>${C.keyLost ? '鍵を1本なくしてしまった…。' : '鍵は2本とも返せる。'}</li></ul>`;
  } else if (docTab === 'album') {
    el.innerHTML = `<h4>入居時チェック表（${C.years}年前・写真つき）</h4><p style="font-size:12px;color:#7d7266;margin:0 0 8px">入居したときに管理会社と確認した、もとからあった傷や汚れ。</p><div class="album">${S.album.map(a => `<figure><div class="ph" style="${a.tex ? `background-image:url(${a.tex.userData.canvas.toDataURL()})` : ''}">${a.tex ? '' : '<div style="padding-top:34px;text-align:center;color:#aaa">写真</div>'}</div><b>${a.name}</b><br>${a.note}</figure>`).join('')}</div>`;
  } else if (docTab === 'real') {
    const names = Object.assign({}, ...Object.entries(DEFS).map(([k, d]) => ({ [k]: d.name })), { cleaning: 'ハウスクリーニング代', key: '鍵の交換代', ac: 'エアコンの内部洗浄代' });
    el.innerHTML = `<h4>実際の退去で気をつけること</h4><ul>
      <li><b>入居したとき</b>：もとからある傷や汚れを日付入りの写真に撮り、チェック表にして管理会社に出しておく。</li>
      <li><b>退去の前</b>：契約書の特約（クリーニング代など）を確認。掃除とゴミ出しは済ませる。自分で補修するなら目立たない所で試してから。</li>
      <li><b>立ち会いのとき</b>：その場で精算書にサインしない。「どこを・何㎡・単価いくら」の明細をもらう。</li>
      <li><b>納得できないとき</b>：国土交通省「原状回復をめぐるトラブルとガイドライン」をもとに話し合う。消費者ホットライン <b>188</b> でも相談できる。</li></ul>
      <h4>傷・汚れ別の直し方</h4>
      ${Object.keys(GUIDE).map(k => `<div style="margin-bottom:8px"><b>${names[k] || k}</b>${guideHTML(k)}</div>`).join('')}
      <p style="font-size:11px;color:#7d7266">※ゲーム内の金額は目安です。実際の負担は、契約の内容や傷みの程度、地域によって変わります。</p>`;
  } else {
    el.innerHTML = `<h4>原状回復のガイドライン（国土交通省）のメモ</h4>
      <p style="font-size:12px;color:#7d7266;margin:0 0 6px">普通に暮らしてできた傷み（通常損耗）や年月による劣化（経年変化）は、家賃に含まれている＝貸主の負担。</p>
      <h4>🙆 借主が払わなくていいもの</h4><ul><li>画鋲・ピンの穴</li><li>日焼けによるクロスの変色・ポスター跡</li><li>冷蔵庫など家電の後ろの黒ずみ</li><li>家具を置いた床のへこみ</li><li>鍵の交換（なくしていなければ）</li><li>次の入居者のためのクリーニング（特約がなく、ふだんの掃除をしていれば）</li><li>エアコンの内部洗浄（タバコを吸っていなければ）</li><li>入居前からあった傷（チェック表が証拠）</li></ul>
      <h4>🙅 借主が払うもの</h4><ul><li>ネジ穴・くぎ穴、不注意でつけた穴や傷</li><li>放っておいたシミ・カビ・油汚れ、落書き</li><li>タバコのヤニ・臭い</li><li>残していった物の処分</li><li>鍵をなくしたときの交換</li><li>金額まではっきり書かれた特約（クリーニングなど）</li></ul>
      <h4>💡 払うときも、減らせるポイント</h4><ul><li>張替えは<b>傷んだ面の分だけ</b>（ヤニなど部屋じゅうの汚れは別）</li><li>クロスは<b>6年で価値がほぼ1円</b>。住んだ年数の分だけ割り引かれる</li><li>フローリングの<b>部分補修</b>は年数で割り引かれない</li></ul>`;
  }
}
$('#docsBtn').onclick = () => { renderDocs(); $('#docs').classList.remove('hidden'); };
$('#docsClose').onclick = () => $('#docs').classList.add('hidden');
$('#docTabs').onclick = e => { const t = e.target.closest('button'); if (t) { docTab = t.dataset.t; renderDocs(); } };

// ---------- 立ち会い ----------
const CHOICES = [
  ['normal', '普通に住んでできたもの（通常損耗）では？'],
  ['photo', '入居したときからありました'],
  ['dep', '住んだ年数で割り引かれるのでは？'],
  ['partial', 'その部分だけの補修で足りるのでは？'],
];
const DEFAULT_REBUT = {
  normal: '普通に暮らしてできたものとは言えないですね。',
  photo: '入居時のチェック表には、ここは書いてないですよ。',
  dep: 'これは年数で割り引くものじゃないですね。',
  partial: 'もう必要な範囲だけですよ。',
};
let choiceResolve = null;
function say(who, text, bill) {
  $('#dlgWho').textContent = who === 'me' ? 'あなた' : '業者・権田';
  $('#dlgWho').classList.toggle('me', who === 'me');
  $('#dlgText').textContent = text;
  const b = $('#dlgBill');
  if (bill) { b.classList.remove('hidden'); $('#dlgLabel').textContent = bill.label; const a = $('#dlgAmt'); a.textContent = yen(bill.amt); a.classList.toggle('zero', bill.amt === 0); }
  else b.classList.add('hidden');
  $('#dlgChoices').innerHTML = '';
  $('#dialog').classList.remove('hidden');
}
function choose(opts) {
  return new Promise(res => {
    const el = $('#dlgChoices'); el.innerHTML = '';
    for (const [k, label, cls] of opts) { const b = document.createElement('button'); b.type = 'button'; b.className = 'btn ' + (cls || ''); b.textContent = label; b.onclick = () => res(k); el.appendChild(b); }
  });
}
async function argue(claim) {
  let amt = claim.amt, label = claim.label, step = 0;
  const first = { amt, label };
  say('them', claim.say, { label, amt });
  while (true) {
    if (amt === 0) { await choose([['ok', '次へ', 'acc']]); break; }
    const opts = S.hearts > 0 ? CHOICES.map(c => [...c]) : [];
    opts.push(['accept', S.hearts > 0 ? '認める（このまま払う）' : '…わかりました（信用がなく、もう言い返せない）', 'acc']);
    const k = await choose(opts);
    if (k === 'accept') { say('me', 'わかりました。', { label, amt }); await sleep(500); break; }
    say('me', CHOICES.find(c => c[0] === k)[1], { label, amt });
    await sleep(800);
    const st = claim.steps[step];
    if (st && st.k === k) {
      amt = st.amt; label = st.label || label; step++;
      say('them', st.reply, { label, amt });
    } else {
      S.hearts--; updateHud();
      const used = claim.steps.slice(0, step).some(s => s.k === k);
      const msg = used ? 'それはもう考慮しましたよ。' : (claim.rebut && claim.rebut[k]) || DEFAULT_REBUT[k];
      say('them', msg + (S.hearts === 0 ? '　…あの、あまりゴネられると困るんですよね。' : ''), { label, amt });
      toast(S.hearts > 0 ? '信用が下がった…' : '信用がなくなった！');
    }
  }
  return { first, final: { amt, label } };
}
async function startInspection() {
  if (S.phase !== 'prep') return;
  S.phase = 'insp';
  closeSheet(); focusOn(null);
  ['#startInspBtn', '#found', '#hint', '#backBtn'].forEach(s => $(s).classList.add('hidden'));
  $('#heartChip').classList.remove('hidden');
  $('#phaseLbl').textContent = '立ち会い';
  $('#clockSub').textContent = '';
  S.clock = Math.max(S.clock, END_MIN);
  updateHud();
  insp.visible = true; insp.position.set(0.47, 0, RZ - 0.3); insp.rotation.y = Math.PI;
  cam.focus = { pos: new THREE.Vector3(-0.6, 2.1, -0.9), look: new THREE.Vector3(0.4, 1.0, RZ - 0.4) };
  say('them', 'どうも、管理会社から来ました権田です。お部屋を確認させていただきますね。');
  await choose([['ok', 'お願いします', 'acc']]);
  // 部屋の奥から順に見ていく
  const targets = spots.filter(s => !s.def.noClaim && !s.done).sort((a, b) => (a.def.pos[0] < -RX) - (b.def.pos[0] < -RX) || a.def.pos[2] - b.def.pos[2]);
  if (!targets.length) { say('them', 'おお…きれいに使われてますね。お部屋の中は問題ないです。'); await choose([['ok', '次へ', 'acc']]); }
  for (const s of targets) {
    $('#dialog').classList.add('hidden');
    cam.focus = null; // 歩いている間は部屋全体を見せる
    const sp = standPos(s.def);
    await walkPath(sp.x, sp.z);
    facePoint(new THREE.Vector3(...s.def.pos));
    cam.focus = spotView(s.def);
    await sleep(350);
    const claim = s.def.claim(S);
    const r = await argue(claim);
    S.log.push({ id: s.id, name: s.def.name, why: s.def.why, ...r });
  }
  $('#dialog').classList.add('hidden');
  cam.focus = null;
  await walkPath(0.45, RZ - 0.75);
  facePoint(new THREE.Vector3(-0.3, 0, 0));
  cam.focus = { pos: new THREE.Vector3(-0.6, 2.1, -0.9), look: new THREE.Vector3(0.4, 1.0, RZ - 0.75) };
  say('them', 'お部屋はこれで全部ですね。あとは書類の上での費用です。');
  await choose([['ok', 'はい', 'acc']]);
  for (const c of paperClaims()) { const r = await argue(c); S.log.push({ id: c.id, name: c.name, why: c.why, ...r }); }
  say('them', 'では、こちらが精算書になります。');
  await choose([['ok', '精算書を見る', 'acc']]);
  $('#dialog').classList.add('hidden');
  showResult();
}

// ---------- 精算書 ----------
function bestCase() {
  // 準備を全部こなし、すべて正しく言い返したときの負担
  let sum = 0;
  for (const s of spots) {
    const d = s.def;
    if (d.noClaim || d.clean || d.fix) continue;
    const c = d.claim({ patchFail: false });
    sum += c.steps.length ? c.steps[c.steps.length - 1].amt : c.amt;
  }
  sum += C.cleaningClause ? 33000 : 0;
  sum += C.keyLost ? 16500 : 0;
  sum += C.smoker ? 13200 : 0;
  return sum;
}
function showResult() {
  S.phase = 'done';
  const total = S.log.reduce((a, l) => a + l.final.amt, 0);
  const firstTotal = S.log.reduce((a, l) => a + l.first.amt, 0);
  const refund = Math.max(0, C.deposit - total), extra = Math.max(0, total - C.deposit);
  const best = Math.max(0, C.deposit - bestCase());
  const ratio = best > 0 ? refund / best : (refund >= best ? 1 : 0);
  const rank = ratio >= 0.99 ? 'S' : ratio >= 0.9 ? 'A' : ratio >= 0.75 ? 'B' : ratio >= 0.5 ? 'C' : 'D';
  const comment = { S: '完ぺき！ 敷金を守りぬいた。', A: 'お見事。ほとんど取り戻せた。', B: 'まずまず。もう少し言い返せたかも。', C: '取られすぎ…。ガイドラインを読み直そう。', D: '業者の言いなりだった…。' }[rank];
  $('#resBody').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px">
      <div><div style="font-size:13px;color:#7d7266">敷金精算書</div><div class="big">${extra ? '追加で ' + yen(extra) + ' 請求' : '返金 ' + yen(refund)}</div>
      <div style="font-size:13px">敷金 ${yen(C.deposit)} − 負担 ${yen(total)}　<span style="color:#7d7266">（最初の請求 ${yen(firstTotal)}）</span></div></div>
      <div class="center"><div class="rank">${rank}</div><div style="font-size:11px;color:#7d7266">最高で ${yen(best)}</div></div>
    </div>
    <p style="margin:8px 0;font-weight:800">${comment}</p>
    <table><tr><th>項目</th><th class="num">請求</th><th class="num">確定</th></tr>
    ${S.log.map(l => `<tr><td><b>${l.name}</b><div class="why">${l.why}</div>${GUIDE[l.id] ? `<details class="real"><summary>実際の退去では？</summary>${guideHTML(l.id)}</details>` : ''}</td><td class="num">${l.first.amt !== l.final.amt ? `<s>${yen(l.first.amt)}</s>` : yen(l.first.amt)}</td><td class="num"><b style="color:${l.final.amt ? '#e2573b' : '#2f8f5b'}">${yen(l.final.amt)}</b></td></tr>`).join('')}
    </table>
    <div class="center" style="margin-top:14px"><button class="btn primary" id="againBtn" type="button" style="font-size:16px;padding:10px 22px">別の部屋でもう一度</button></div>`;
  $('#result').classList.remove('hidden');
  $('#againBtn').onclick = () => { $('#result').classList.add('hidden'); startRound(); };
}

// ---------- 開始 ----------
function startRound() {
  buildRound();
  insp.visible = false;
  cam.az = -0.72; cam.pol = 0.92; cam.r = baseR(); cam.focus = null;
  $('#phaseLbl').textContent = '準備';
  $('#clockSub').textContent = '立ち会い 12:00';
  ['#hud', '#found', '#startInspBtn', '#hint'].forEach(s => $(s).classList.remove('hidden'));
  $('#heartChip').classList.add('hidden');
  $('#backBtn').classList.add('hidden');
  updateHud();
  docTab = 'contract'; renderDocs(); $('#docs').classList.remove('hidden');
}
$('#startBtn').onclick = () => { $('#title').classList.add('hidden'); startRound(); };
$('#startInspBtn').onclick = () => startInspection();
$('#backBtn').onclick = () => { closeSheet(); focusOn(null); };

// ---------- ループ ----------
const baseR = () => innerWidth / innerHeight < 0.8 ? 13 : 9.6;
function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.fov = camera.aspect < 0.8 ? 62 : 45; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
const tmpV = new THREE.Vector3(); let last = performance.now();
function tick(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  // 業者の歩き
  if (inspTarget) {
    const d = tmpV.copy(inspTarget).sub(insp.position); d.y = 0;
    const dist = d.length();
    if (dist < 0.04) { inspTarget = null; const r = inspResolve; inspResolve = null; r && r(); }
    else { const st = Math.min(dist, 1.3 * dt); insp.position.addScaledVector(d.normalize(), st); insp.rotation.y = Math.atan2(d.x, d.z); inspWalk += dt * 9; }
  }
  const sw = inspTarget ? Math.sin(inspWalk) * 0.5 : 0;
  const u = insp.userData;
  if (u.legs) { u.legs[0].rotation.x = sw; u.legs[1].rotation.x = -sw; u.arms[0].rotation.x = inspTarget ? -sw * 0.3 : -0.5; u.arms[1].rotation.x = sw * 0.6; }
  // カメラ
  const want = cam.focus ? cam.focus.pos : overviewPos(tmpV.clone());
  const look = cam.focus ? cam.focus.look : cam.target;
  const k = 1 - Math.exp(-dt * 4);
  camPos.lerp(want, k); camLook.lerp(look, k);
  camera.position.copy(camPos); camera.lookAt(camLook);
  // カメラ側の壁を隠す
  // 全体を見るとき：カメラが壁の外側にあれば隠す。寄るとき：カメラと見る点の間をさえぎる壁を隠す
  for (const key in walls) {
    const g = walls[key], w = g.userData;
    if (!cam.focus) { g.visible = !((camPos[w.axis] - w.at) * w.out > 0.15); continue; }
    const da = camPos[w.axis] - w.at, db = camLook[w.axis] - w.at;
    let block = false;
    if (da * db < 0) {
      const t = da / (da - db), o = w.axis === 'z' ? 'x' : 'z';
      const c = camPos[o] + (camLook[o] - camPos[o]) * t;
      block = t < 0.98 && c > w.lo - 0.25 && c < w.hi + 0.25;
    }
    g.visible = !block;
  }
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
// 何も始まっていない間も、部屋を見せておく
buildRound();
window.__t = { get S() { return S; }, get C() { return C; }, spots: () => spots, startInspection, openSpot, cam, insp };
</script>
