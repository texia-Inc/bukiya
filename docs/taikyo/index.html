<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>退去シミュレーター</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b2622;--paper:#fffaf0;--line:#d9cdb8;--accent:#e2573b;--ok:#2f8f5b;--blue:#2f6fae;--muted:#7d7266}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#dfe9ef;font-family:'M PLUS Rounded 1c','Hiragino Maru Gothic ProN',system-ui,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;touch-action:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer;border:0}
.hidden{display:none!important}
#hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 12px 0;pointer-events:none}
.chip{pointer-events:auto;background:rgba(255,250,240,.94);border:2px solid var(--ink);border-radius:12px;padding:6px 10px;box-shadow:0 3px 0 rgba(0,0,0,.18);font-weight:800;font-size:14px;line-height:1.3}
.chip small{display:block;font-weight:500;font-size:11px;color:var(--muted)}
#clock b{font-size:20px}
#rightHud{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
#docsBtn,#backBtn,#startInspBtn{pointer-events:auto}
#docsBtn{background:#fff3c4}
#hearts{color:var(--accent);letter-spacing:1px}
#found{position:fixed;left:12px;top:calc(76px + env(safe-area-inset-top));pointer-events:none}
#areaBar{position:fixed;left:12px;right:110px;top:calc(76px + env(safe-area-inset-top));display:flex;flex-wrap:wrap;gap:6px}
#areaBar button{background:rgba(255,250,240,.94);border:2px solid var(--ink);border-radius:999px;padding:4px 10px;font-weight:800;font-size:13px;box-shadow:0 2px 0 rgba(0,0,0,.18)}
#areaBar button.on{background:var(--ink);color:#fff}
#backBtn{position:fixed;left:12px;bottom:calc(16px + env(safe-area-inset-bottom));background:#fff;font-weight:800}
#startInspBtn{position:fixed;right:12px;bottom:calc(16px + env(safe-area-inset-bottom));background:var(--accent);color:#fff;font-weight:800;font-size:15px;padding:10px 14px}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(70px + env(safe-area-inset-bottom));background:rgba(43,38,34,.82);color:#fff;border-radius:20px;padding:6px 14px;font-size:13px;pointer-events:none;white-space:nowrap}
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));width:min(560px,calc(100% - 20px));background:var(--paper);border:3px solid var(--ink);border-radius:16px;padding:14px 14px 12px;box-shadow:0 6px 0 rgba(0,0,0,.2)}
.sheet h3{margin:0 0 4px;font-size:18px}
.sheet p{margin:0 0 10px;font-size:14px;line-height:1.6}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{background:#fff;border:2px solid var(--ink);border-radius:10px;padding:8px 12px;font-weight:800;font-size:14px;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.btn.primary{background:var(--accent);color:#fff}
.btn.good{background:#e6f4ea}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn small{font-weight:500;font-size:11px;margin-left:4px}
#dialog .who{display:inline-block;background:var(--ink);color:#fff;border-radius:8px;padding:2px 10px;font-size:12px;font-weight:800;margin-bottom:6px}
#dialog .who.me{background:var(--blue)}
#dialog .bill{display:flex;justify-content:space-between;align-items:center;background:#fff;border:2px dashed var(--line);border-radius:10px;padding:6px 10px;margin:0 0 10px;font-weight:800}
#dialog .bill .amt{color:var(--accent);font-size:20px}
#dialog .bill .amt.zero{color:var(--ok)}
#dialog .choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#dialog .choices .btn{text-align:left;font-size:13px;padding:8px 10px}
#dialog .choices .btn.acc{grid-column:1/-1;text-align:center;background:#f1ece2}
.overlay{position:fixed;inset:0;background:rgba(30,26,22,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.panel{background:var(--paper);border:3px solid var(--ink);border-radius:18px;width:min(560px,100%);max-height:calc(100% - 20px);overflow:auto;padding:18px;box-shadow:0 8px 0 rgba(0,0,0,.25);-webkit-user-select:text;user-select:text;touch-action:pan-y}
.logo{font-size:34px;font-weight:800;line-height:1.15;text-align:center;margin:6px 0 4px}
.logo small{display:block;font-size:15px;color:var(--accent)}
.tag{text-align:center;font-size:14px;line-height:1.8;margin:10px 0 16px}
.center{text-align:center}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tabs button{background:#efe7d8;border:2px solid var(--ink);border-radius:10px;padding:6px 10px;font-weight:800;font-size:13px}
.tabs button.on{background:var(--ink);color:#fff}
.doc{font-size:14px;line-height:1.7}
.doc h4{margin:10px 0 4px;font-size:15px}
.doc ul{margin:0;padding-left:20px}
.doc table{border-collapse:collapse;width:100%}
.doc td{border-bottom:1px solid var(--line);padding:4px 2px;vertical-align:top}
.stamp{display:inline-block;border:2px solid var(--accent);color:var(--accent);border-radius:6px;padding:0 6px;font-weight:800;font-size:12px;transform:rotate(-4deg)}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.album figure{margin:0;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px;font-size:12px}
.album .ph{height:90px;border-radius:4px;background:#efe9df center/contain no-repeat}
.res table{width:100%;border-collapse:collapse;font-size:13px}
.res td,.res th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.res th{font-size:12px;color:var(--muted)}
.res .num{text-align:right;white-space:nowrap}
.res s{color:var(--muted)}
.res .why{font-size:12px;color:var(--muted);line-height:1.5}
.big{font-size:30px;font-weight:800}
.rank{font-size:56px;font-weight:800;color:var(--accent);line-height:1}
.guide{background:#f4f8ef;border:1px solid #cfe0c2;border-radius:10px;padding:8px 10px;font-size:12.5px;line-height:1.6;margin:0 0 10px;-webkit-user-select:text;user-select:text}
.guide>div+div{margin-top:4px}
.guide .links{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.guide .links a{display:inline-block;background:#fff;border:1.5px solid #e59a2b;color:#8a4b00;border-radius:999px;padding:2px 10px;text-decoration:none;font-weight:800}
.guide .links span{font-size:11px;color:var(--muted)}
.res .guide{margin:6px 0 0}
details.real summary{cursor:pointer;font-size:12px;color:var(--blue);font-weight:800;margin-top:4px}
#spotSheet{max-height:70vh;overflow:auto;touch-action:pan-y}
.est .item{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px;background:#fff}
.est .item b{font-size:14px}
.est .opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.est .opts button{background:#f4efe6;border:2px solid var(--line);border-radius:8px;padding:4px 8px;font-size:12.5px;font-weight:800}
.est .opts button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.est .item.todo{border-color:var(--accent)}
#docs{z-index:5}
.ans{border:1px solid var(--line);border-left:6px solid var(--ok);border-radius:10px;padding:8px 10px;margin:0 0 8px;background:#fff;font-size:13px;line-height:1.6}
.ans.ng{border-left-color:var(--accent)}
.ans .ah{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.ans .ah b{font-size:14.5px}
.ans .kind{font-size:11px;font-weight:800;border-radius:999px;padding:1px 8px;background:#eef2f6;color:#2f4a6b;white-space:nowrap}
.ans .kind.t{background:#fde9e4;color:#a4351f}.ans .kind.o{background:#e6f4ea;color:#23704a}
.ans .amts{font-weight:800}
.ans .amts .bad{color:var(--accent)}.ans .amts .good{color:var(--ok)}
.ans .mv{color:#4d443b}
.ans .mv .x{color:var(--accent);font-weight:800}.ans .mv .o{color:var(--ok);font-weight:800}
.ans .prep{color:#8a5a00}
.sum{background:#fff;border:2px dashed var(--line);border-radius:10px;padding:8px 10px;margin:0 0 10px;font-size:13px;line-height:1.7}
.sum b{font-size:14px}
.adslot{margin:14px 0 0;min-height:100px;display:flex;align-items:center;justify-content:center}
.adslot.preview{border:2px dashed var(--line);border-radius:10px;color:var(--muted);font-size:12px}
#toast{position:fixed;left:50%;top:calc(90px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:12px;padding:8px 14px;font-weight:800;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hidden">
  <div class="chip" id="clock"><small id="phaseLbl">準備</small><b id="clockTxt">9:00</b> <span id="clockSub" style="font-size:11px;font-weight:500">立ち会い 12:00</span></div>
  <div id="rightHud">
    <div class="chip" id="depositChip"><small>敷金</small><span id="depTxt"></span></div>
    <div class="chip hidden" id="heartChip"><small>信用</small><span id="hearts"></span></div>
    <button class="chip" id="docsBtn" type="button">📄 書類</button>
  </div>
</div>
<div class="chip hidden" id="found"></div>
<div id="areaBar" class="hidden"></div>
<button class="chip hidden" id="backBtn" type="button">← 部屋全体</button>
<button class="chip hidden" id="startInspBtn" type="button">立ち会いを始める ▶</button>
<div id="hint" class="hidden">ドラッグで回転・タップで調べる</div>

<div id="spotSheet" class="sheet hidden">
  <h3 id="spotName"></h3>
  <p id="spotDesc"></p>
  <div class="btns" id="spotBtns"></div>
</div>

<div id="dialog" class="sheet hidden">
  <div class="who" id="dlgWho">業者</div>
  <p id="dlgText"></p>
  <div class="bill hidden" id="dlgBill"><span id="dlgLabel"></span><span class="amt" id="dlgAmt"></span></div>
  <div class="choices" id="dlgChoices"></div>
</div>

<div id="title" class="overlay">
  <div class="panel">
    <div class="logo">退去シミュレーター<small>〜 敷金を守りぬけ 〜</small></div>
    <div class="tag"><b>入居者として</b>：午前中に部屋を片づけ、立ち会いで不当な請求に言い返して敷金を取り戻す。<br><b>業者として</b>：退去した部屋を点検して見積もりを作り、入居者に説明する。取りすぎても取らなすぎてもダメ。</div>
    <div class="center btns" style="justify-content:center"><button class="btn primary" id="startBtn" type="button" style="font-size:17px;padding:10px 20px">入居者として</button><button class="btn" id="startAgentBtn" type="button" style="font-size:17px;padding:10px 20px;background:#2f4a6b;color:#fff">業者として</button></div>
  </div>
</div>

<div id="docs" class="overlay hidden">
  <div class="panel">
    <div class="tabs" id="docTabs">
      <button data-t="contract" class="on" type="button">契約書</button>
      <button data-t="album" type="button">入居時チェック表</button>
      <button data-t="guide" type="button">ガイドラインメモ</button>
      <button data-t="real" type="button">実際の退去ガイド</button>
    </div>
    <div class="doc" id="docBody"></div>
    <div class="center" style="margin-top:12px"><button class="btn" id="docsClose" type="button">閉じる</button></div>
  </div>
</div>

<div id="estimate" class="overlay hidden">
  <div class="panel est">
    <h3 style="margin:0 0 4px">見積もり（敷金 <span id="estDep"></span>）</h3>
    <p style="font-size:12px;color:#7d7266;margin:0 0 8px">点検で記録した所と、書類の上での費用。それぞれ誰の負担か・いくら請求するかを選ぶ。契約書・入居時チェック表は「書類」で見られる。</p>
    <div id="estList"></div>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap">
      <b>請求の合計 <span id="estTotal" style="color:#e2573b"></span></b>
      <div class="btns"><button class="btn" id="estDocs" type="button">📄 書類</button><button class="btn" id="estBack" type="button">← 点検にもどる</button><button class="btn primary" id="estGo" type="button">入居者に説明する ▶</button></div>
    </div>
  </div>
</div>

<div id="result" class="overlay hidden">
  <div class="panel res" id="resBody"></div>
</div>

<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
const $ = s => document.querySelector(s);
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const yen = n => '¥' + Math.round(n).toLocaleString();
const sleep = ms => new Promise(r => setTimeout(r, ms));

// ---------- 部屋の寸法（内側）----------
const RX = 1.8, RZ = 2.7, RH = 2.4;
// 水回り（左の壁の向こう）：洗面所 z>PZ、浴室 z<PZ
const WX0 = -3.6, BZ = 0.5, PZ = 1.55;
const START_MIN = 9 * 60, END_MIN = 12 * 60;

// ---------- 契約と、その回の状態 ----------
let C, S;
function newContract() {
  const rent = pick([52000, 58000, 64000, 70000]);
  return {
    rent, deposit: rent * 2, years: pick([2, 3, 4, 5, 7]),
    smoker: Math.random() < 0.3, cleaningClause: Math.random() < 0.5, keyLost: Math.random() < 0.25,
  };
}
// クロスは6年で残存価値1円（経過年数を考慮した負担額）
const depRate = () => Math.max(0, 1 - C.years / 6);
const dep = base => C.years >= 6 ? 1 : Math.max(1, Math.round(base * depRate() / 100) * 100);
const depLabel = () => `入居${C.years}年を考慮`;
const depReply = () => C.years >= 6
  ? `…入居${C.years}年だと、クロスの価値はもう残ってないですね。1円にしておきます。`
  : `…入居${C.years}年なら、クロスの価値は${Math.round(depRate() * 100)}%残りですね。その分だけにします。`;

// ---------- 傷・汚れの定義 ----------
// kind: owner=通常損耗（貸主負担） tenant=借主負担 premove=入居前から
// steps: 正しく言い返すと進む減額の段階。k は有効な言い分
const CLOTH = 15000;
const DEFS = {
  pins: { name: '画鋲の穴', wall: 'L', pos: [-RX, 1.5, -2.05], size: [.5, .4], kind: 'owner',
    desc: 'カレンダーを貼っていた画鋲の小さな穴がいくつかある。',
    claim: () => ({ say: '壁に画鋲の穴がありますね。クロスの張替えになります。', label: 'クロス張替え（1面）', amt: CLOTH,
      steps: [{ k: 'normal', amt: 0, reply: '…まあ、画鋲くらいなら普通の生活の範囲ですね。これは結構です。' }] }),
    why: '画鋲・ピンの穴（下地ボードの張替えが要らない程度）は通常損耗で、貸主の負担。' },
  sunburn: { name: 'ポスターの日焼け跡', wall: 'B', pos: [-1.33, 1.4, -RZ], size: [.62, .82], kind: 'owner',
    desc: 'ポスターを貼っていた所だけ白く、まわりが日に焼けている。',
    claim: () => ({ say: 'ポスターの跡がくっきり残ってますね。張替えです。', label: 'クロス張替え（1面）', amt: CLOTH,
      steps: [{ k: 'normal', amt: 0, reply: '…日焼けは住んでいれば仕方ないですね。わかりました。' }] }),
    why: '日差しによるクロスの変色（ポスターの跡を含む）は通常損耗で、貸主の負担。' },
  fridge: { name: '冷蔵庫の後ろの黒ずみ', wall: 'R', pos: [RX, 1.0, 0.75], size: [.7, 1.3], kind: 'owner',
    desc: '冷蔵庫を置いていた後ろの壁が、黒く変色している。',
    claim: () => ({ say: '冷蔵庫の裏、真っ黒ですね。ここは張替えさせてもらいます。', label: 'クロス張替え（1面）', amt: CLOTH,
      steps: [{ k: 'normal', amt: 0, reply: '…電気ヤケは冷蔵庫を使えば出ますからね。結構です。' }] }),
    why: '冷蔵庫など家電の後ろの壁の黒ずみ（電気ヤケ）は通常損耗で、貸主の負担。' },
  dents: { name: 'ベッドの脚のへこみ', wall: 'F0', pos: [-1.3, 0, -1.65], size: [1.0, 2.0], kind: 'owner',
    desc: 'ベッドを置いていた所の床に、脚の跡のへこみが4つある。',
    claim: () => ({ say: '床にへこみが4か所。フローリングの補修ですね。', label: 'フローリング補修', amt: 22000,
      steps: [{ k: 'normal', amt: 0, reply: '…家具を置いた跡ですか。それは普通の使い方ですね。' }] }),
    why: '家具を置いたことによる床のへこみや跡は通常損耗で、貸主の負担。' },
  screw: { name: '棚を付けたネジ穴', wall: 'R', pos: [RX, 1.6, -2.0], size: [.42, .32], kind: 'tenant',
    desc: '壁に棚を付けたときのネジ穴が4つ。下地のボードまで穴があいている。',
    fix: { label: 'パテで埋める', t: 30, rate: 0.7 },
    claim: s => ({ say: s.patchFail ? 'ネジ穴、自分で埋めました？ 色が違ってかえって目立ちますね。部屋全体で張替えます。'
        : 'ネジ穴ですね。ボードまで開いてますから、部屋全体のクロス張替えです。',
      label: 'クロス張替え（部屋全面）', amt: 60000,
      steps: [{ k: 'partial', amt: CLOTH, label: 'クロス張替え（1面）', reply: '…確かに、張替えはその面だけで足りますね。1面分にします。' },
              { k: 'dep', amt: dep(CLOTH), label: `クロス1面（${depLabel()}）`, reply: depReply() }] }),
    why: 'ネジ穴・くぎ穴（ボードの張替えが必要な程度）は借主の負担。ただし負担は傷んだ面の分だけで、クロスは6年で価値がほぼ1円になる。' },
  caster: { name: '椅子のキャスター傷', wall: 'F0', pos: [0.95, 0, -1.55], size: [1.0, 1.0], kind: 'tenant',
    desc: '机の椅子を動かしていた所の床に、こすれた傷が広がっている。',
    claim: () => ({ say: 'キャスターの傷ですね。床は全部張替えになります。', label: 'フローリング張替え（全面）', amt: 110000,
      steps: [{ k: 'partial', amt: 28000, label: 'フローリング部分補修', reply: '…まあ、傷の範囲だけの補修でいけますね。' }],
      rebut: { dep: 'フローリングの部分補修は、住んだ年数は関係ないんですよ。' } }),
    why: 'キャスター付きの椅子などによる床の傷は借主の負担。ただし補修は傷の範囲だけで、フローリングの部分補修は経過年数を考慮しない。' },
  hole: { name: '壁の穴', wall: 'R', pos: [RX, 0.45, -0.6], size: [.32, .32], kind: 'tenant',
    desc: '物をぶつけて、壁に穴があいてしまった。自分では直せそうにない。',
    claim: () => ({ say: '穴があいてますね。ボードの補修と、クロスは部屋全体で張替えです。', label: 'ボード補修＋クロス全面', amt: 72000,
      steps: [{ k: 'partial', amt: 12000 + CLOTH, label: 'ボード補修＋クロス1面', reply: '…そうですね、張替えはこの面だけにしましょう。' },
              { k: 'dep', amt: 12000 + dep(CLOTH), label: `ボード補修＋クロス1面（${depLabel()}）`, reply: '…クロス分は年数で割り引きます。ボードの補修代はそのままですよ。' }] }),

function buildRound() {

  C = newContract();
  S = { room: pick(['western', 'washitsu', 'pet']), phase: 'prep', clock: START_MIN, hearts: 3, vacuumed: false, patchFail: false, log: [], boss: pick(['honest', 'normal', 'normal', 'crook', 'crook']), signed: true };
  setRoomLook(S.room);
  const W = S.room === 'washitsu';
  const ids = [
    ...shuffle(W ? ['tatamiSun', 'tatamiDent', 'pins', 'sunburn', 'fridge'] : ['pins', 'sunburn', 'fridge', 'dents']).slice(0, 3),
    ...shuffle(W ? ['tatamiBurn', 'fusumaTear', 'shojiHole', 'screw', 'hole'] : ['screw', 'caster', 'hole']).slice(0, W ? 3 : 2),
    ...shuffle(W ? ['tatamiStain', 'grease', 'mold', 'scribble'] : ['stain', 'grease', 'mold', 'scribble']).slice(0, 3),
    ...(S.room === 'pet' ? ['petScratch', 'petUrine', 'petHair'] : []),

    else if (id === 'dust') { mesh = makeDust(); scene.add(mesh); hit = mesh; }
    else {

      g.add(mesh);

      hit = new THREE.Mesh(new THREE.PlaneGeometry(Math.max(.55, def.size[0]), Math.max(.55, def.size[1])), new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false }));

function shapeClaim(c) {
  const fair = fairOf(c);
  if (S.boss === 'honest') {
    if (fair === 0 && Math.random() < 0.7) return null; // 通常損耗はそもそも請求しない

function choose(opts) {

    const el = $('#dlgChoices'); el.innerHTML = '';
    for (const [k, label, cls] of opts) { const b = document.createElement('button'); b.type = 'button'; b.className = 'btn ' + (cls || ''); b.textContent = label; b.onclick = () => res(k); el.appendChild(b); }

async function argue(claim) {
  let base = claim.amt, label = claim.label, step = 0, f = claim.inflate || 1;
  const show = () => base <= 1 ? base : Math.round(base * f / 100) * 100;
  let amt = show();
  const first = { amt, label }, moves = [];
  say('them', claim.say, { label, amt });
  while (true) {
    if (amt === 0) { await choose([['ok', '次へ', 'acc']]); break; }
    const opts = S.hearts > 0 ? CHOICES.map(c => [...c]) : [];
    opts.push(['accept', S.hearts > 0 ? '認める（このまま払う）' : '…わかりました（信用がなく、もう言い返せない）', 'acc']);
    const k = await choose(opts);
    if (k === 'accept') { moves.push({ k, ok: true }); say('me', 'わかりました。', { label, amt }); await sleep(500); break; }
    say('me', CHOICES.find(c => c[0] === k)[1], { label, amt });
    await sleep(800);
    const st = claim.steps[step];
    const good = (k === 'detail' && f > 1) || (st && st.k === k);
    moves.push({ k, ok: !!good });
    if (k === 'detail' && f > 1) {
      f = 1; amt = show();
      say('them', '…あ、単価を高く書いてましたね。正しい金額に直します。', { label, amt });
    } else if (st && st.k === k) {
      base = st.amt; label = st.label || label; step++; amt = show();
      say('them', st.reply, { label, amt });
    } else {
      S.hearts--; updateHud();
      const used = claim.steps.slice(0, step).some(s => s.k === k);
      const msg = used ? 'それはもう考慮しましたよ。' : (claim.rebut && claim.rebut[k]) || DEFAULT_REBUT[k];
      say('them', msg + (S.hearts === 0 ? '　…あの、あまりゴネられると困るんですよね。' : ''), { label, amt });
      toast(S.hearts > 0 ? '信用が下がった…' : '信用がなくなった！');
    }
  }
  return { first, final: { amt, label }, fair: claim.fair ?? fairOf(claim), moves,
    path: [...(claim.inflate > 1 ? ['detail'] : []), ...claim.steps.map(x => x.k)] };
}

const SAY = { normal: '通常損耗では？', photo: '入居時からあった', dep: '年数で割り引いて', partial: '部分補修で足りる', detail: '明細を見せて', none: '傷はない', accept: '認めた' };

}

    <div class="amts">請求 ${yen(l.first.amt)} → 確定 ${yen(l.final.amt)}　／　適正 ${yen(l.fair)}　${ok ? '<span class="good">✓ 適正</span>' : `<span class="bad">払いすぎ ${yen(diff)}</span>`}</div>

    ${missed.map(m => `<div class="ans ng"><div class="ah"><b>${m.name}</b><span class="kind t">見落とし・借主の負担</span></div><div class="amts">請求できた ${yen(m.fair)}</div><div class="why">${m.why}</div></div>`).join('')}
    <div class="center btns" style="margin-top:14px;justify-content:center"><button class="btn primary" id="againBtn" type="button" style="font-size:16px;padding:10px 22px">次の部屋へ</button><button class="btn" id="toTitleBtn" type="button">タイトルへ</button></div>
    <div class="adslot" id="adSlot"></div>`;
  renderAd();
  $('#result').classList.remove('hidden');
  $('#againBtn').onclick = () => { $('#result').classList.add('hidden'); startRound(); };
  $('#toTitleBtn').onclick = () => { $('#result').classList.add('hidden'); $('#title').classList.remove('hidden'); };
}

// ---------- 開始 ----------
let MODE = 'tenant';
function startRound() {
  buildRound();
  S.mode = MODE;
  insp.visible = false;
  setArea('all');
  $('#phaseLbl').textContent = '準備';
  $('#clockSub').textContent = '立ち会い 12:00';
  $('#startInspBtn').textContent = '立ち会いを始める ▶';
  $('#hint').textContent = 'ドラッグで回転・タップで調べる';
  if (MODE === 'agent') {
    simulateTenantPrep();
    S.tenant = pick(['savvy', 'timid', 'claimer']); S.est = null;
    $('#phaseLbl').textContent = '業者モード';
    $('#clockTxt').textContent = '点検';
    $('#clockSub').textContent = '見落としに注意';
    $('#startInspBtn').textContent = '見積もりを作る ▶';
    $('#hint').textContent = '傷・汚れをタップして記録する';
  }
  ['#hud', '#startInspBtn', '#hint', '#areaBar'].forEach(s => $(s).classList.remove('hidden'));
  $('#heartChip').classList.add('hidden');
  $('#backBtn').classList.add('hidden');
  if (MODE !== 'agent') updateHud();
  docTab = 'contract'; renderDocs(); $('#docs').classList.remove('hidden');
}
$('#startBtn').onclick = () => { MODE = 'tenant'; $('#title').classList.add('hidden'); startRound(); };
$('#startAgentBtn').onclick = () => { MODE = 'agent'; $('#title').classList.add('hidden'); startRound(); };
$('#startInspBtn').onclick = () => S.mode === 'agent' ? openEstimate() : startInspection();
$('#estGo').onclick = () => agentExplain();
$('#backBtn').onclick = () => { closeSheet(); focusOn(null); };

// ---------- ループ ----------
const baseR = () => innerWidth / innerHeight < 0.8 ? 13 : 9.6;
function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.fov = camera.aspect < 0.8 ? 62 : 45; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
const tmpV = new THREE.Vector3(); let last = performance.now();
function tick(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  // 業者の歩き
  if (inspTarget) {
    const d = tmpV.copy(inspTarget).sub(insp.position); d.y = 0;
    const dist = d.length();
    if (dist < 0.04) { inspTarget = null; const r = inspResolve; inspResolve = null; r && r(); }
    else { const st = Math.min(dist, 1.3 * dt); insp.position.addScaledVector(d.normalize(), st); insp.rotation.y = Math.atan2(d.x, d.z); inspWalk += dt * 9; }
  }
  const sw = inspTarget ? Math.sin(inspWalk) * 0.5 : 0;
  const u = insp.userData;
  if (u.legs) { u.legs[0].rotation.x = sw; u.legs[1].rotation.x = -sw; u.arms[0].rotation.x = inspTarget ? -sw * 0.3 : -0.5; u.arms[1].rotation.x = sw * 0.6; }
  // カメラ
  const want = cam.focus ? cam.focus.pos : overviewPos(tmpV.clone());
  const look = cam.focus ? cam.focus.look : cam.target;
  const k = 1 - Math.exp(-dt * 4);
  camPos.lerp(want, k); camLook.lerp(look, k);
  camera.position.copy(camPos); camera.lookAt(camLook);
  // カメラ側の壁を隠す
  // 全体を見るとき：カメラが壁の外側にあれば隠す。寄るとき：カメラと見る点の間をさえぎる壁を隠す
  for (const key in walls) {
    const g = walls[key], w = g.userData;
    if (!cam.focus && cam.area === 'all') { g.visible = !((camPos[w.axis] - w.at) * w.out > 0.15); continue; }
    const da = camPos[w.axis] - w.at, db = camLook[w.axis] - w.at;
    let block = false;
    if (da * db < 0) {
      const t = da / (da - db), o = w.axis === 'z' ? 'x' : 'z';
      const c = camPos[o] + (camLook[o] - camPos[o]) * t;
      block = t < 0.98 && c > w.lo - 0.25 && c < w.hi + 0.25;
    }
    g.visible = !block;
  }
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
// 何も始まっていない間も、部屋を見せておく
buildRound();
window.__t = { get S() { return S; }, get C() { return C; }, spots: () => spots, startInspection, openSpot, cam, insp };
</script>
