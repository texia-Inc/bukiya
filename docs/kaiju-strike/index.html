<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>怪獣迎撃 KAIJU STRIKE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
html,body{margin:0}
/* Layout: full-bleed portrait 3D view in the style of a mobile game ad; outlined HUD text floats over the scene. Single look by choice. */
:root{
  --ink:#0a1014;
  --panel:rgba(8,14,18,.86);
  --line:rgba(190,214,222,.22);
  --steel:#a9bcc4;
  --text:#ffffff;
  --gold:#ffd23a;
  --alert:#ff3a22;
  --reticle:#21431c;
  --ok:#7ee35f;
  --f-display:"Dela Gothic One","Hiragino Kaku Gothic StdN","Yu Gothic",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --f-hud:"Chakra Petch","Zen Kaku Gothic New",ui-monospace,monospace;
  --stroke:0 0 1px #000,1px 1px 0 #000,-1px 1px 0 #000,1px -1px 0 #000,-1px -1px 0 #000,0 2px 0 #000,0 3px 6px rgba(0,0,0,.45);
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;background:var(--ink);color:var(--text);overflow:hidden}
body{font-family:var(--f-body);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{position:relative;width:100%;height:100%;overflow:hidden;touch-action:none;background:#9cc0dc}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#flash{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .25s}
#vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(0,10,20,.38))}
#hud{position:absolute;inset:0;pointer-events:none;font-family:var(--f-hud)}
#hud button{pointer-events:auto}
#app.is-title #hud{display:none}

.boss{position:absolute;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));width:min(92%,420px);display:flex;flex-direction:column;align-items:center;gap:5px}
.boss-name{display:flex;align-items:baseline;gap:10px;text-shadow:var(--stroke)}
#waveLbl{font-family:var(--f-hud);font-weight:700;font-size:13px;letter-spacing:.12em;color:var(--gold)}
#bossName{font-family:var(--f-display);font-size:20px;letter-spacing:.04em}
.bar{position:relative;width:100%;height:12px;background:rgba(0,0,0,.55);border:2px solid #111;border-radius:3px;overflow:hidden;box-shadow:0 2px 0 rgba(0,0,0,.35)}
.bar i{position:absolute;inset:0 auto 0 0;width:100%;background:linear-gradient(180deg,#ff8a3a,#ff3a22 55%,#c41a0c);transition:width .12s}
.bar i.ghost{background:#fff;opacity:.6;transition:width .6s .25s}
.bar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 9.5%,rgba(0,0,0,.35) 9.5% 10%)}
#cores{display:flex;gap:7px;align-items:center;font-size:10px;font-weight:700;letter-spacing:.14em;text-shadow:var(--stroke)}
#cores span{width:11px;height:11px;transform:rotate(45deg);border:1.5px solid #000;background:#ff7a1f;box-shadow:0 0 8px #ff7a1f}
#cores span.x{background:#3a3633;box-shadow:none}

.res{position:absolute;left:14px;top:calc(92px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:6px}
.coin-row{display:flex;align-items:center;gap:8px}
.nut{width:26px;height:26px;background:radial-gradient(circle,#000 0 26%,transparent 27%),linear-gradient(160deg,#fff3a0,#ffc61a 50%,#c98a00);clip-path:polygon(25% 4%,75% 4%,100% 50%,75% 96%,25% 96%,0 50%);
  -webkit-mask:radial-gradient(circle,transparent 0 24%,#000 25%);mask:radial-gradient(circle,transparent 0 24%,#000 25%)}
#coinVal{font-family:var(--f-display);font-size:24px;color:var(--gold);text-shadow:var(--stroke);font-variant-numeric:tabular-nums}
.coin-row.pulse{animation:pulse .22s}
@keyframes pulse{50%{transform:scale(1.15)}}
.armor-row{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:700;letter-spacing:.1em;text-shadow:var(--stroke)}
.armor-row .bar{width:110px;height:9px}
.armor-row .bar i{background:linear-gradient(180deg,#b6ff8a,#4fc23a)}
.armor-row.low .bar i{background:linear-gradient(180deg,#ff8a6a,#e0281a)}
#muteBtn{position:absolute;right:12px;top:calc(92px + env(safe-area-inset-top,0px));width:36px;height:36px;border-radius:50%;border:2px solid #111;background:rgba(0,0,0,.45);color:#fff;font-size:15px;cursor:pointer}

#combo{position:absolute;right:16px;top:38%;text-align:right;font-family:var(--f-display);text-shadow:var(--stroke);line-height:1}
#combo b{display:block;font-size:40px;color:#fff}
#combo span{font-family:var(--f-hud);font-weight:700;font-size:14px;letter-spacing:.2em;color:var(--gold)}
#combo.bump b{animation:pulse .15s}

#banner{position:absolute;left:0;right:0;top:30%;text-align:center;text-shadow:var(--stroke);animation:bannerIn 2.4s forwards}
#banner small{display:block;font-family:var(--f-hud);font-weight:700;font-size:16px;letter-spacing:.3em;color:var(--gold)}
#banner b{display:block;font-family:var(--f-display);font-size:40px;line-height:1.15;color:#fff}
#banner em{display:inline-block;margin-top:6px;font-style:normal;font-family:var(--f-display);font-size:18px;color:#fff;background:var(--alert);padding:3px 12px;border:2px solid #000;text-shadow:none;transform:skewX(-8deg)}
@keyframes bannerIn{0%{opacity:0;transform:scale(1.6)}12%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}

#warn{position:absolute;left:50%;top:64%;transform:translateX(-50%) skewX(-8deg);background:linear-gradient(180deg,#ff4a2a,#b4120a);border:2px solid #000;
  padding:6px 16px;font-family:var(--f-display);font-size:16px;white-space:nowrap;animation:blink .3s infinite alternate;box-shadow:0 0 18px rgba(255,60,20,.7)}
@keyframes blink{to{opacity:.6}}

#reticle{position:absolute;left:50%;top:50%;width:min(50vw,240px);aspect-ratio:1;transform:translate(-50%,-50%);overflow:visible}
#reticle .out{stroke:rgba(255,255,255,.55);stroke-width:5;fill:none}
#reticle .in{stroke:var(--reticle);stroke-width:2.4;fill:none}
#reticle.hit .in{stroke:#ffe14a}
#reticle .lock{stroke:var(--alert);stroke-width:2.5;fill:none;opacity:0;transition:opacity .15s}
#reticle.on .lock{opacity:1}

#nums{position:absolute;inset:0;overflow:hidden}
.num{position:absolute;left:0;top:0;font-family:var(--f-display);font-size:18px;color:#fff;text-shadow:var(--stroke);white-space:nowrap;will-change:transform}
.num.weak{color:var(--gold);font-size:26px}
.num.big{font-size:30px;color:#fff;letter-spacing:.03em}
.num.big.gold{color:var(--gold)}
#arrow{position:absolute;left:0;top:0;width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-bottom:24px solid var(--alert);filter:drop-shadow(0 0 3px #000)}

#stick{position:absolute;width:124px;height:124px;left:14px;bottom:calc(24px + env(safe-area-inset-bottom,0px));border-radius:50%;
  background:radial-gradient(circle,#1b2126 50%,#424c54 51% 53%,#2a3238 54% 64%,transparent 65%),
  conic-gradient(from -40deg,#5fe36b 0 60deg,transparent 60deg 80deg,#ffcf3d 80deg 140deg,transparent 140deg 220deg,#ff4a3a 220deg 280deg,transparent 280deg);
  box-shadow:0 0 0 4px #6b757c inset,0 0 0 2px #111,0 5px 14px rgba(0,0,0,.5)}
#stick.on{transform:translate(-50%,50%)}
#knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#56606a,#14191d);box-shadow:0 2px 6px #000,0 0 0 2px #0a0d10}

.btn-fire{position:absolute;right:12px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:136px;height:136px;border-radius:50%;border:0;cursor:pointer;
  background:radial-gradient(circle at 50% 42%,#ff4a3a 0 30%,#d8160c 52%,#f4f1ec 53% 57%,#b0130a 58% 64%,#2d343a 65% 74%,#6a757c 75% 79%,#2d343a 80%);
  color:#f9ece4;font-family:var(--f-hud);font-weight:700;font-style:italic;font-size:31px;letter-spacing:.06em;text-shadow:0 2px 0 #6a0904;
  box-shadow:0 6px 18px rgba(0,0,0,.55);touch-action:none}
.btn-fire.down{transform:scale(.94);filter:brightness(1.25)}
.btn-mis{position:absolute;right:152px;bottom:calc(28px + env(safe-area-inset-bottom,0px));width:76px;height:76px;border-radius:50%;cursor:pointer;
  border:4px solid #2d343a;outline:2px solid #6a757c;color:#fff;font-family:var(--f-hud);font-weight:700;font-size:11px;letter-spacing:.08em;text-shadow:0 1px 0 #000;
  background:conic-gradient(rgba(0,0,0,.65) calc(var(--cd,0)*1turn),transparent 0),radial-gradient(circle at 50% 40%,#4aa0e8,#1a4f86);touch-action:none}
.btn-mis.ready{box-shadow:0 0 0 3px #9fd8ff,0 0 20px #3aa0ff}
.btn-mis small{display:block;font-size:17px;margin-top:2px}
button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

.panel{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding-inline:16px;
  background:linear-gradient(180deg,rgba(6,10,13,0),rgba(6,10,13,.78) 60%);z-index:5}
#title{align-items:flex-end;padding-block:24px calc(24px + env(safe-area-inset-bottom,0px))}
.logo{position:absolute;left:0;right:0;top:12%;text-align:center;pointer-events:none}
.logo b{display:block;font-family:var(--f-display);font-size:clamp(46px,15vw,84px);line-height:1;letter-spacing:.02em;color:#fff;
  -webkit-text-stroke:3px #000;paint-order:stroke fill;text-shadow:0 5px 0 #000,0 0 30px rgba(255,90,20,.8);transform:skewX(-6deg)}
.logo span{display:inline-block;margin-top:10px;font-family:var(--f-hud);font-style:italic;font-weight:700;font-size:18px;letter-spacing:.32em;color:#fff;background:var(--alert);padding:3px 14px;border:2px solid #000;transform:skewX(-8deg)}
.card{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.card h2{font-family:var(--f-display);font-size:26px;margin:0;text-wrap:balance}
.card p{margin:0;line-height:1.65;color:#d4dfe1;font-size:14px}
.how{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px;line-height:1.5;margin:0}
.how dt{font-family:var(--f-hud);font-weight:700;color:var(--gold);letter-spacing:.06em}
.how dd{margin:0;color:#dbe4e5}
.cta{appearance:none;border:2px solid #000;border-radius:8px;padding:14px;font-family:var(--f-display);font-size:20px;letter-spacing:.06em;cursor:pointer;
  color:#fff;background:linear-gradient(180deg,#ff5a3a,#c4180c);box-shadow:0 4px 0 #5e0c06;text-shadow:0 2px 0 #6a0904}
.cta:active{transform:translateY(2px);box-shadow:0 2px 0 #5e0c06}
.cta.pulse{animation:ctaPulse 1.1s infinite}
@keyframes ctaPulse{50%{transform:scale(1.04)}}
.shop-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.shop-coins{display:flex;align-items:center;gap:6px;font-family:var(--f-display);font-size:20px;color:var(--gold)}
.items{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 10px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.04);
  color:var(--text);text-align:left;font:inherit;cursor:pointer}
.item:disabled{opacity:.4;cursor:not-allowed}
.item b{font-size:15px}
.item .lv{font-family:var(--f-hud);color:var(--steel);font-size:12px;letter-spacing:.06em}
.item .cost{grid-row:span 2;font-family:var(--f-display);font-size:17px;color:var(--gold);font-variant-numeric:tabular-nums}
.item small{color:#b3c2c6;font-size:12px}
.result{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px;margin:0}
.result dt{color:var(--steel)}
.result dd{margin:0;font-family:var(--f-hud);font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.tag{font-family:var(--f-hud);font-size:11px;letter-spacing:.2em;color:var(--steel)}
@media (prefers-reduced-motion:reduce){#warn,.cta.pulse,#banner{animation:none}}
</style>
</head>
<body>
<div id="app" class="is-title">
  <canvas id="cv"></canvas>
  <div id="vignette"></div>
  <div id="flash"></div>
  <div id="hud">
    <div class="boss" id="bossBox">
      <div class="boss-name"><span id="waveLbl">WAVE 1</span><span id="bossName">ヴォルカドン</span></div>
      <div class="bar"><i class="ghost" id="bossGhost"></i><i id="bossHp"></i></div>
      <div id="cores">CORE</div>
    </div>
    <div class="res">
      <div class="coin-row" id="coinChip"><i class="nut"></i><b id="coinVal">0</b></div>
      <div class="armor-row" id="armorChip"><span>ARMOR</span><div class="bar"><i id="towerHp"></i></div></div>
    </div>
    <button id="muteBtn" aria-label="サウンド切替">♪</button>
    <div id="combo" hidden><b id="comboN">0</b><span>HIT</span></div>
    <div id="banner" hidden></div>
    <div id="warn" hidden>熱線チャージ！ 横に逃げろ</div>
    <svg id="reticle" viewBox="-110 -110 220 220" aria-hidden="true">
      <g class="out">
        <path d="M-88 0 A88 88 0 0 1 0 -88"/><path d="M88 0 A88 88 0 0 1 0 88"/>
        <path d="M-108 0 H-30 M30 0 H108 M0 -100 V-78 M0 78 V100 M0 4 V40"/><path d="M-8 -2 L0 -13 L8 -2"/>
      </g>
      <g class="in">
        <path d="M-88 0 A88 88 0 0 1 0 -88" stroke-dasharray="1.2 2.6" stroke-width="7"/>
        <path d="M88 0 A88 88 0 0 1 0 88" stroke-dasharray="1.2 2.6" stroke-width="7"/>
        <path d="M0 -88 A88 88 0 0 1 88 0 M0 88 A88 88 0 0 1 -88 0" stroke-dasharray="1.2 9"/>
        <path d="M-108 0 H-30 M30 0 H108 M0 -100 V-78 M0 78 V100 M0 4 V40 M-5 40 H5"/>
        <path d="M-96 0 l3 -8 l3 8 M-80 0 l3 -8 l3 8 M-64 0 l3 -8 l3 8 M-48 0 l3 -8 l3 8 M42 0 l3 -8 l3 8 M58 0 l3 -8 l3 8 M74 0 l3 -8 l3 8 M90 0 l3 -8 l3 8"/>
        <path d="M-8 -2 L0 -13 L8 -2"/>
      </g>
      <g class="lock"><path d="M-40 -28 V-40 H-28 M28 -40 H40 V-28 M40 28 V40 H28 M-28 40 H-40 V28"/></g>
    </svg>
    <div id="arrow" hidden></div>
    <div id="nums"></div>
    <div id="stick"><div id="knob"></div></div>
    <button class="btn-mis" id="misBtn" aria-label="ミサイル発射">MISSILE<small id="misCount">×4</small></button>
    <button class="btn-fire" id="fireBtn" aria-label="射撃">FIRE</button>
  </div>

  <div class="panel" id="title">
    <div class="logo"><b>怪獣迎撃</b><span>KAIJU STRIKE</span></div>
    <div class="card">
      <dl class="how">
        <dt>移動</dt><dd>画面の左側をドラッグ。砲台ごと動いて熱線を避ける（PCは WASD）</dd>
        <dt>照準</dt><dd>画面の右側をドラッグ（PCは矢印キー）</dd>
        <dt>FIRE</dt><dd>押している間、連装砲を連射（Space）</dd>
        <dt>MISSILE</dt><dd>光る弱点コアを狙う追尾ミサイル（E）</dd>
      </dl>
      <button class="cta pulse" id="startBtn">タップして出撃</button>
    </div>
  </div>

  <div class="panel" id="shop" hidden>
    <div class="card">
      <div class="shop-head"><h2 id="shopTitle">WAVE 1 撃破</h2><div class="shop-coins"><i class="nut"></i><b id="shopCoins">0</b></div></div>
      <p>武器屋で砲台を強化して、次の怪獣に備えよう。</p>
      <div class="items" id="items"></div>
      <button class="cta" id="nextBtn">次のWAVEへ</button>
    </div>
  </div>

  <div class="panel" id="over" hidden>
    <div class="card">
      <span class="tag" id="overTag">DEFENSE LINE BROKEN</span>
      <h2 id="overTitle">防衛失敗</h2>
      <dl class="result">
        <dt>到達WAVE</dt><dd id="rWave">1</dd>
        <dt>撃破した怪獣</dt><dd id="rKills">0</dd>
        <dt>獲得ゴールド</dt><dd id="rGold">0</dd>
        <dt>街の被害</dt><dd id="rDmg">0%</dd>
      </dl>
      <button class="cta" id="retryBtn">もう一度出撃</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
const V3 = THREE.Vector3;
const app = $('app'), cv = $('cv');
const rand = (a = 0, b = 1) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function seeded(s) { return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function canvasTex(w, h, draw, repeat) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }
  t.anisotropy = 4; return t;
}

// ---------- renderer / scene ----------
const DPR = Math.min(window.devicePixelRatio || 1, 1.75);
const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(DPR);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const FOG = 0xc2d5e2;
scene.fog = new THREE.Fog(FOG, 320, 2100);
const camera = new THREE.PerspectiveCamera(60, 1, 0.3, 4000);
camera.rotation.order = 'YXZ';
const CAM_POS = new V3(0, 120, 50);
camera.position.copy(CAM_POS);
scene.add(camera);
scene.add(new THREE.HemisphereLight(0xcfe3ff, 0x6a5f50, 0.55));
const sun = new THREE.DirectionalLight(0xfff0d8, 0.85);
sun.position.set(-240, 420, 160); sun.target.position.set(0, 0, -240);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -480, right: 480, top: 420, bottom: -420, near: 50, far: 1300 });
sun.shadow.bias = -0.0006;
scene.add(sun, sun.target);

// bloom: render HDR when the device can, so only emissive things and fire glow
let composer = null, bloom = null;
try {
  if (THREE.EffectComposer && THREE.UnrealBloomPass) {
    const hdr = renderer.capabilities.isWebGL2 && renderer.extensions.has('EXT_color_buffer_float');
    const rt = new THREE.WebGLRenderTarget(4, 4, { type: hdr ? THREE.HalfFloatType : THREE.UnsignedByteType, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, format: THREE.RGBAFormat });
    composer = new THREE.EffectComposer(renderer, rt);
    composer.addPass(new THREE.RenderPass(scene, camera));
    bloom = new THREE.UnrealBloomPass(new THREE.Vector2(256, 256), hdr ? .9 : .45, .55, hdr ? 1.12 : .88);
    composer.addPass(bloom);
  }
} catch (e) { composer = null; }

// ---------- sky ----------
const sky = new THREE.Mesh(new THREE.SphereGeometry(3000, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { top: { value: new THREE.Color(0x2f6fc4) }, mid: { value: new THREE.Color(0x7fb0dc) }, hor: { value: new THREE.Color(FOG) }, sunDir: { value: new V3(-240, 420, 400).normalize() } },

  if (moving && Math.sign(sn) !== Math.sign(MECH.lastSin)) { dust(new V3(MECH.x, 2, MECH.z), 1.2); crush(MECH.x, MECH.z, 8); }
  MECH.lastSin = sn;
  const face = Math.atan2(K.p.g.position.x - MECH.x, K.p.g.position.z - MECH.z);
  mech.g.rotation.y += (face - mech.g.rotation.y) * Math.min(1, dt * 3);
  mech.core.material.color.setRGB(.6, 2.4 + Math.sin(G.t * 6) * .5, 3);
  MECH.firing = Math.max(0, MECH.firing - dt);
  mech.arms.forEach((a, i) => { const aim = MECH.firing > 0 ? -1.4 : -.2 + Math.sin(G.t * 1.5 + i) * .08; a.rotation.x += (aim - a.rotation.x) * Math.min(1, dt * 6); });
  if (kaijuAlive() && G.state === 'play' && K.mode !== 'emerge') {
    MECH.atk -= dt;
    if (MECH.atk <= 0 && dist < 80) {
      MECH.atk = rand(5, 7); MECH.firing = 1.4; sfx.missile();
      const body = K.p.hb.filter(h => h.kind !== 'weak');
      for (let k = 0; k < 8; k++) {
        mech.pods[k % 2].getWorldPosition(_w);
        fireMissile(_w.clone().add(new V3(rand(-2, 2), 4, rand(-2, 2))), new V3(rand(-12, 12), rand(40, 60), rand(-12, 12)), body[k % body.length], k * .1, true);
      }
    }
  }
}

// ---------- coins update ----------
function coinTarget() {
  const r = $('coinChip').getBoundingClientRect(), a = app.getBoundingClientRect();
  const nx = ((r.left + 14 - a.left) / a.width) * 2 - 1, ny = -(((r.top + r.height / 2 - a.top) / a.height) * 2 - 1);
  return new V3(nx, ny, .5).unproject(camera).sub(camera.position).normalize().multiplyScalar(18).add(camera.position);
}
function updateCoins(dt) {
  let target = null;
  for (const c of coins) {
    if (c.life <= 0) continue;
    c.life -= dt;
    const age = 3 - c.life;
    c.m.rotation.x += c.spin.x * dt; c.m.rotation.y += c.spin.y * dt;
    if (age < c.home) { c.v.y -= 30 * dt; c.m.position.addScaledVector(c.v, dt); }
    else {
      target = target || coinTarget();
      const k = Math.min(1, (age - c.home) * 1.9);
      c.m.position.lerp(target, Math.min(1, dt * (1.5 + k * 9)));
      const dd = c.m.position.distanceTo(target);
      c.m.scale.setScalar(Math.min(1.6, .25 + dd / 30));
      if (dd < 2.5 || c.life <= 0) { collect(c); sfx.coin(); }
    }
  }
}

// ---------- UI ----------
function updateBossUI(reset) {
  if (!K) return;
  $('bossName').textContent = K.def.name;
  $('waveLbl').textContent = 'WAVE ' + G.wave;
  const p = Math.max(0, K.hp / K.maxHp) * 100;
  $('bossHp').style.width = p + '%';
  $('bossGhost').style.transition = reset ? 'none' : '';
  $('bossGhost').style.width = p + '%';
  const col = '#' + K.def.glow.toString(16).padStart(6, '0');
  $('cores').innerHTML = 'CORE ' + K.p.cores.map(c => `<span class="${c.broken ? 'x' : ''}"${c.broken ? '' : ` style="background:${col};box-shadow:0 0 8px ${col}"`}></span>`).join('');
}
function updateTowerUI() {
  $('towerHp').style.width = G.tower + '%';
  $('armorChip').classList.toggle('low', G.tower < 30);
}
function updateMisUI() {
  const max = stats.misCdMax();
  const b = $('misBtn'); b.style.setProperty('--cd', clamp(G.misCd / max, 0, 1));
  b.classList.toggle('ready', G.misCd <= 0);
  $('misCount').textContent = G.misCd > 0 ? Math.ceil(G.misCd) + 's' : '×' + stats.misN();
}
function showBanner(html) {
  const b = $('banner'); b.innerHTML = html; b.hidden = false; b.style.animation = 'none'; void b.offsetWidth; b.style.animation = '';
  clearTimeout(showBanner.t); showBanner.t = setTimeout(() => { b.hidden = true; }, 2400);
}
const SHOP = [
  { id: 'dmg', name: '徹甲弾', desc: '連装砲とミサイルの威力 +30%', cost: lv => 80 + 70 * lv, max: 8 },
  { id: 'rate', name: '高速装填機', desc: '連射速度 +20%', cost: lv => 80 + 70 * lv, max: 6 },
  { id: 'mis', name: 'ミサイルポッド', desc: '発射数 +2、再装填 -1秒', cost: lv => 110 + 90 * lv, max: 5 },
  { id: 'fix', name: '装甲修理', desc: '砲台の装甲を40回復', cost: () => 60, max: 99 },
];
function renderShop() {
  $('shopCoins').textContent = G.coins;
  const box = $('items'); box.innerHTML = '';
  for (const it of SHOP) {
    const lv = it.id === 'fix' ? 0 : G.up[it.id];
    const cost = it.cost(lv);
    const full = it.id === 'fix' ? G.tower >= 100 : lv >= it.max;
    const b = document.createElement('button'); b.className = 'item'; b.id = 'buy-' + it.id;
    b.disabled = full || G.coins < cost;
    b.innerHTML = `<b>${it.name} <span class="lv">${it.id === 'fix' ? Math.round(G.tower) + '/100' : 'Lv.' + lv}</span></b><span class="cost">${full ? 'MAX' : cost + ' G'}</span><small>${it.desc}</small>`;
    b.addEventListener('click', () => {
      if (G.coins < cost || full) return;
      G.coins -= cost; $('coinVal').textContent = G.coins; sfx.ui();
      if (it.id === 'fix') { G.tower = Math.min(100, G.tower + 40); updateTowerUI(); } else G.up[it.id]++;
      renderShop();
    });
    box.appendChild(b);
  }
}
function openShop() {
  G.state = 'shop'; I.firing = false; $('fireBtn').classList.remove('down'); $('combo').hidden = true;
  addCoins(100 + 40 * G.wave);
  $('shopTitle').textContent = `WAVE ${G.wave} 撃破`;
  renderShop(); $('shop').hidden = false;
  if (!NX) spawnNext();
}
function gameOver(title, tag) {
  if (G.state !== 'play') return;
  G.state = 'over'; I.firing = false; beam.visible = false; $('warn').hidden = true; $('flash').style.opacity = 0; $('combo').hidden = true;
  $('overTitle').textContent = title; $('overTag').textContent = tag;
  $('rWave').textContent = G.wave; $('rKills').textContent = G.kills; $('rGold').textContent = G.earned;
  $('rDmg').textContent = Math.round(G.destroyed / buildings.length * 100) + '%';
  setTimeout(() => { $('over').hidden = false; }, 900);
}
function startWave() {
  G.state = 'play'; G.misCd = 0;
  for (const o of orbs) { o.life = 0; o.m.visible = false; }
  const promoted = !!NX;
  if (NX) { spawnKaiju('walk', NX); NX = null; } else spawnKaiju('emerge');
  sfx.roar(); G.shake = .8;
  MECH.active = true; MECH.x = -230; MECH.z = clamp(K.z + 160, COAST + 30, -160); MECH.atk = 6;
  showBanner(`<small>WAVE ${G.wave}</small><b>${K.def.name}</b><em>${promoted ? '襲来！' : '上陸！'}</em>`);
  updateMisUI();
  // sculpt the next, bigger kaiju early so it can walk in mid-fight without a hitch
  setTimeout(() => kaijuShapes(kaijuDef(G.wave + 1)), 2500);
}
// ---------- the next kaiju, approaching from behind ----------
let NX = null;
function spawnNext() {
  if (NX) return;
  const def = kaijuDef(G.wave + 1), p = buildKaiju(def);
  scene.add(p.g);
  const side = Math.random() < .5 ? -1 : 1;
  NX = { def, p, z: -1300, x: side * rand(80, 150), phase: 0, lastSin: 0, y: -12 };
  p.g.position.set(NX.x, NX.y, NX.z);
  showBanner(`<small>WARNING</small><b>後方から巨大反応</b><em>${def.name} 接近中</em>`);
  tone('sawtooth', 70, 38, 2.4, .25); noise(2.2, 'lowpass', 300, 60, .35);
}
function updateNext(dt) {
  if (!NX) return;
  const P = NX.p, d = NX.def;
  const walking = NX.z < -720 && G.state === 'play';
  if (walking) { NX.z += d.speed * 1.5 * dt; NX.phase += dt * d.speed * 1.5 * .26 / d.scale; }
  const sn = Math.sin(NX.phase);
  if (P.walk) { if (walking) P.walk(NX.phase); } else P.legs.forEach(l => { l.p.rotation.x = walking ? sn * .42 * l.s : l.p.rotation.x * .95; });
  P.tail.forEach((s, i) => { s.rotation.y = Math.sin(G.t * 1.1 - i * .55) * .13; });
  P.hips.position.y = (P.hipY || 27) + Math.sin(G.t * 1.4) * .5;
  P.headPivot.rotation.x = Math.sin(G.t * .6) * .12 - .15;
  P.g.position.set(NX.x, NX.y + (walking ? Math.abs(Math.cos(NX.phase)) * 1.4 : 0), NX.z);
  P.g.rotation.y = Math.atan2(G.pos.x - NX.x, G.pos.z - NX.z) * .6;
  P.U.uGlow.value = 2.2 + Math.sin(G.t * 2) * .6; P.glow.emissiveIntensity = 1 + Math.sin(G.t * 2) * .3;
  if (walking && Math.sign(sn) !== Math.sign(NX.lastSin) && NX.lastSin !== 0) {
    P.legs[sn > 0 ? 0 : 1].fm.getWorldPosition(_w); splash(new V3(_w.x, 0, _w.z), 3.5); G.shake = Math.max(G.shake, .25); sfx.stomp();
  }
  NX.lastSin = sn;
}
function clearNext() { if (NX) { scene.remove(NX.p.g); NX = null; } }
function newGame() {
  Object.assign(G, { wave: 1, coins: 0, earned: 0, kills: 0, tower: 100, up: { dmg: 0, rate: 0, mis: 0 }, yaw: 0, pitch: -.14, roll: 0, combo: 0 });
  G.pos.copy(CAM_POS); G.vel.set(0, 0, 0); clearNext();
  $('coinVal').textContent = 0; resetCity(); updateTowerUI();
  PARTS.forEach(p => p.clear());
  startWave();
}

// ---------- input ----------
const stick = $('stick'), knob = $('knob');
let stickId = null, sx = 0, sy = 0, aimId = null, lx = 0, ly = 0;
app.addEventListener('pointerdown', e => {
  initAudio();
  if (G.state !== 'play' || e.target.closest('button')) return;
  const r0 = app.getBoundingClientRect();
  if (e.clientX - r0.left > r0.width * .5) {
    if (aimId !== null) return;
    aimId = e.pointerId; lx = e.clientX; ly = e.clientY;
    try { app.setPointerCapture(e.pointerId); } catch (_) {}
    return;
  }
  if (stickId !== null) return;
  stickId = e.pointerId; sx = e.clientX; sy = e.clientY;
  stick.classList.add('on'); stick.style.left = (sx - r0.left) + 'px'; stick.style.bottom = (r0.bottom - sy) + 'px';
  try { app.setPointerCapture(e.pointerId); } catch (_) {}
});
app.addEventListener('pointermove', e => {
  if (e.pointerId === aimId) { I.ax -= (e.clientX - lx) * .0035; I.ay -= (e.clientY - ly) * .0035; lx = e.clientX; ly = e.clientY; return; }
  if (e.pointerId !== stickId) return;
  let dx = e.clientX - sx, dy = e.clientY - sy; const R = 56, l = Math.hypot(dx, dy);
  if (l > R) { dx *= R / l; dy *= R / l; }
  I.jx = dx / R; I.jy = dy / R; knob.style.transform = `translate(${dx}px,${dy}px)`;
});
function endStick(e) {
  if (e.pointerId === aimId) { aimId = null; return; }
  if (e.pointerId !== stickId) return;
  stickId = null; I.jx = I.jy = 0; knob.style.transform = ''; stick.classList.remove('on'); stick.style.left = ''; stick.style.bottom = '';
}
app.addEventListener('pointerup', endStick); app.addEventListener('pointercancel', endStick);
const fireBtn = $('fireBtn');
const fireOn = e => { e.preventDefault(); initAudio(); I.firing = true; fireBtn.classList.add('down'); try { fireBtn.setPointerCapture(e.pointerId); } catch (_) {} };
const fireOff = () => { I.firing = false; fireBtn.classList.remove('down'); };
fireBtn.addEventListener('pointerdown', fireOn);
fireBtn.addEventListener('pointerup', fireOff); fireBtn.addEventListener('pointercancel', fireOff); fireBtn.addEventListener('lostpointercapture', fireOff);
$('misBtn').addEventListener('pointerdown', e => { e.preventDefault(); initAudio(); launchMissiles(); });
$('muteBtn').addEventListener('click', () => { muted = !muted; $('muteBtn').textContent = muted ? '×' : '♪'; });
app.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('keydown', e => {
  I.keys[e.code] = true;
  if (e.code === 'Space') { I.firing = true; fireBtn.classList.add('down'); e.preventDefault(); initAudio(); }
  if (e.code === 'KeyE' || e.code === 'ShiftLeft') launchMissiles();
});
addEventListener('keyup', e => { I.keys[e.code] = false; if (e.code === 'Space') fireOff(); });
addEventListener('blur', () => { I.keys = {}; fireOff(); });
$('startBtn').addEventListener('click', () => { initAudio(); sfx.ui(); $('title').hidden = true; app.classList.remove('is-title'); newGame(); });
$('retryBtn').addEventListener('click', () => { sfx.ui(); $('over').hidden = true; newGame(); });
$('nextBtn').addEventListener('click', () => { sfx.ui(); $('shop').hidden = true; G.wave++; startWave(); });

// ---------- resize ----------
function resize() {
  const w = app.clientWidth, h = app.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h;
  camera.fov = w / h < 1 ? 56 : 48; camera.updateProjectionMatrix();
  if (composer) { composer.setPixelRatio(DPR); composer.setSize(w, h); }
  const sc = h * renderer.getPixelRatio() / (2 * Math.tan(camera.fov * Math.PI / 360));
  PARTS.forEach(p => p.mat.uniforms.scale.value = sc);
  const halfW = Math.tan(camera.fov * Math.PI / 360) * camera.aspect * 1.6;
  barrels.forEach(b => b.g.position.x = b.s * Math.min(.75, halfW * .42));
}
addEventListener('resize', resize); resize();

// ---------- loop ----------
spawnKaiju('idle');
let last = performance.now();
const offPos = new V3();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  G.t += dt;
  const play = G.state === 'play';

  if (play) {
    const k = I.keys;
    const mx = clamp(I.jx + (k.KeyD ? 1 : 0) - (k.KeyA ? 1 : 0), -1, 1);
    const my = clamp(I.jy + (k.KeyS ? 1 : 0) - (k.KeyW ? 1 : 0), -1, 1);
    const tx = (k.ArrowRight ? 1 : 0) - (k.ArrowLeft ? 1 : 0), ty = (k.ArrowDown ? 1 : 0) - (k.ArrowUp ? 1 : 0);
    // move: strafe along the view's right vector, climb/dive; a little turn so one thumb can chase the kaiju
    const rx = Math.cos(G.yaw), rz = -Math.sin(G.yaw);
    G.vel.x += (mx * 80 * rx - G.vel.x) * Math.min(1, dt * 3.5);
    G.vel.z += (mx * 80 * rz - G.vel.z) * Math.min(1, dt * 3.5);
    G.vel.y += (-my * 50 - G.vel.y) * Math.min(1, dt * 3.5);
    G.pos.addScaledVector(G.vel, dt);
    G.pos.set(clamp(G.pos.x, -240, 240), clamp(G.pos.y, 70, 190), clamp(G.pos.z, 20, 120));
    G.yaw -= (mx * .45 + tx * 1.2) * dt;
    G.pitch -= (-my * .12 + ty * .9) * dt;
    G.yaw += I.ax; G.pitch += I.ay; I.ax = I.ay = 0;
    G.yaw = clamp(G.yaw, -1.1, 1.1); G.pitch = clamp(G.pitch, -.9, .75);
    G.roll += (-mx * .22 - G.roll) * Math.min(1, dt * 4);
    G.comboT -= dt; if (G.comboT <= 0 && G.combo) { G.combo = 0; $('combo').hidden = true; }
  } else if (G.state === 'title') { G.yaw = Math.sin(G.t * .15) * .1; G.pitch = -.1; G.roll = 0; G.pos.copy(CAM_POS); }
  G.shake = Math.max(0, G.shake - dt * 2.2);
  const sh = G.shake * G.shake, bob = Math.sin(G.t * 1.7) * .5;
  camera.rotation.set(G.pitch + rand(-1, 1) * sh * .02, G.yaw + rand(-1, 1) * sh * .02, G.roll);
  camera.position.set(G.pos.x + rand(-1, 1) * sh * .6, G.pos.y + bob + rand(-1, 1) * sh * .6, G.pos.z);
  camera.updateMatrixWorld();
  camera.getWorldDirection(camFwd);
  sky.position.copy(camera.position);

  if (play) {
    G.fireCd -= dt;
    if (I.firing && G.fireCd <= 0) { fireGun(); G.fireCd = Math.max(G.fireCd, -.05) + stats.interval(); }
    G.misCd = Math.max(0, G.misCd - dt);
    updateMisUI();
  }
  for (const b of barrels) {
    b.recoil = Math.max(0, b.recoil - dt * 3); b.g.position.z = -.7 + b.recoil * .6;
    b.ft -= dt; b.flash.visible = b.ft > 0;
  }

  updateKaiju(dt);
  updateNext(dt);
  updateHitboxes();
  updateMech(dt);
  updateBullets(dt);
  updateMissiles(dt);
  updateOrbs(dt);
  updateCoins(dt);
  updateFalling(dt);
  updateDebris(dt);
  updateRings(dt);
  updateMarks(dt);
  PARTS.forEach(p => p.update(dt));
  updateNums(dt);
  NORMAL_SEA.offset.set(G.t * .006, G.t * .011);

  reticleT -= dt;
  const ret = $('reticle'); ret.classList.toggle('hit', reticleT > 0);
  const arrow = $('arrow');
  if (play && kaijuAlive()) {
    offPos.copy(K.p.hb[4].w).project(camera);
    const behind = offPos.z > 1;
    let x = offPos.x, y = offPos.y; if (behind) { x = -x; y = -y; }
    const onScreen = !behind && Math.abs(x) < .95 && Math.abs(y) < .95;
    arrow.hidden = onScreen;
    if (!onScreen) {
      const a = Math.atan2(y, x), w = app.clientWidth, h = app.clientHeight;
      const m = Math.max(Math.abs(x), Math.abs(y)) || 1;
      const ex = (x / m * .85 * .5 + .5) * w, ey = (-y / m * .85 * .5 + .5) * h;
      arrow.style.transform = `translate(${ex - 14}px,${ey - 12}px) rotate(${Math.PI / 2 - a}rad)`;
    }
    const near = K.p.hb.some(hb => { const toC = hb.w.clone().sub(camera.position); const t = toC.dot(camFwd); return t > 0 && toC.addScaledVector(camFwd, -t).length() < hb.wr; });
    ret.classList.toggle('on', near);
  } else { arrow.hidden = true; ret.classList.remove('on'); }

  if (play) {
    // drop the expensive passes on devices that cannot keep up
    Q.n++; Q.sum += dt;
    if (Q.n === 90) {
      const avg = Q.sum / Q.n;
      if (avg > .03 && Q.level === 0) { Q.level = 1; composer = null; renderer.shadowMap.enabled = false; sun.castShadow = false; scene.traverse(o => { if (o.material) o.material.needsUpdate = true; }); }
      else if (avg > .03 && Q.level === 1) { Q.level = 2; renderer.setPixelRatio(1); resize(); }
      Q.n = 0; Q.sum = 0;
    }
  }
  if (composer) composer.render(); else renderer.render(scene, camera);
}
const Q = { n: 0, sum: 0, level: 0 };
updateTowerUI(); updateMisUI();
requestAnimationFrame(frame);
})();
</script>
