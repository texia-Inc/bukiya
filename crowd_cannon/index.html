<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1b2230">
  <title>群勢キャノン</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
    <canvas id="game"></canvas>

    <div id="hud" hidden>
      <div class="hud-top">
        <div id="stageName"></div>
        <button id="pauseBtn" aria-label="一時停止">II</button>
      </div>
      <div class="bars">
        <div class="bar-row">
          <span class="tag blue">味方</span><b id="blueCount">0</b>
          <span class="tag red">敵</span><b id="redCount">0</b>
          <span class="tag green">砦</span><b id="baseHp">0</b>
        </div>
        <div class="bar"><div id="progressFill" class="fill red"></div></div>
        <div class="bar"><div id="baseFill" class="fill green"></div></div>
      </div>
      <div id="hint"></div>
    </div>

    <div id="title" class="overlay">
      <h1>群勢<span>キャノン</span></h1>
      <p class="lead">兵を撃ち出し、倍率の門で増やして<br>押し寄せる赤の大軍を食い止めろ！</p>
      <button id="startBtn" class="primary">プレイ</button>
      <button id="selectBtn">ステージ選択</button>
      <p class="howto">押し続けて発射 ／ 左右にドラッグで移動<br>PC: ← → で移動・スペースで発射</p>
    </div>

    <div id="select" class="overlay" hidden>
      <h2>ステージ選択</h2>
      <div id="levels"></div>
      <button id="backBtn">もどる</button>
    </div>

    <div id="pause" class="overlay" hidden>
      <h2>一時停止</h2>
      <button id="resumeBtn" class="primary">つづける</button>
      <button id="quitBtn">ステージ選択へ</button>
    </div>

    <div id="result" class="overlay" hidden>
      <h2 id="resultTitle"></h2>
      <p id="resultStats"></p>
      <p id="allClear" hidden>全ステージ制覇！おめでとう！</p>
      <button id="nextBtn" class="primary">次のステージ</button>
      <button id="retryBtn">もう一度</button>
      <button id="menuBtn">ステージ選択</button>
    </div>
  </div>

  <script src="src/sim.js"></script>
  <script src="src/levels.js"></script>
  <script src="src/render.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
